    function parseFormationLines(formation) {
      const parts = String(formation || "4-4-2")
        .split("-")
        .map((value) => Number(value.trim()))
        .filter((value) => Number.isFinite(value) && value > 0);

      return parts.length ? parts : [4, 4, 2];
    }

    function isDefenderAbbr(abbr) {
      return (
        abbr === "RB" || abbr === "LB" || abbr === "RWB" || abbr === "LWB"
        || abbr === "CB" || abbr === "RCB" || abbr === "LCB"
        || abbr.startsWith("CD")
      );
    }

    function lineupRoleDepth(player, formation) {
      const abbr = String(player.positionAbbr || "").toUpperCase().trim();
      const lines = parseFormationLines(formation);
      const lineCount = lines.length;
      const lastCount = lines[lineCount - 1] || 1;
      const secondLastCount = lineCount >= 2 ? lines[lineCount - 2] : 0;
      const pivotSize = lineCount >= 2 ? lines[1] : 4;
      const isDoublePivot = pivotSize === 2 && lineCount >= 4;

      if (abbr === "G" || abbr === "GK") {
        return 0;
      }

      if (isDefenderAbbr(abbr)) {
        return 10;
      }

      if (lastCount === 1 && (abbr === "F" || abbr.startsWith("ST"))) {
        return 90;
      }

      if (
        lastCount === 1
        && secondLastCount === 2
        && (abbr.startsWith("CF") || abbr.startsWith("AM") || abbr === "CAM")
      ) {
        return 70;
      }

      if (
        lastCount === 2
        && (abbr === "F" || abbr.startsWith("ST") || abbr.startsWith("CF"))
      ) {
        return 90;
      }

      if (
        lastCount === 3
        && (abbr === "F" || abbr.startsWith("ST") || abbr === "LW" || abbr === "RW")
      ) {
        return 85;
      }

      if (
        lastCount === 3
        && (abbr.startsWith("AM") || abbr === "CAM")
      ) {
        return 80;
      }

      if (
        lastCount === 1
        && lineCount >= 4
        && secondLastCount === 3
        && (abbr.startsWith("AM") || abbr === "LW" || abbr === "RW" || abbr === "CAM")
      ) {
        return 65;
      }

      if (isDoublePivot && (abbr === "DM" || abbr === "CDM" || abbr === "LM" || abbr === "RM")) {
        return 30;
      }

      if (pivotSize === 1 && lineCount >= 4 && (abbr === "DM" || abbr === "CDM")) {
        return 28;
      }

      if (abbr.startsWith("AM") || abbr === "LW" || abbr === "RW" || abbr === "CAM") {
        return 55;
      }

      if (abbr.startsWith("CM")) {
        return 40;
      }

      if (abbr === "LM" || abbr === "RM") {
        return 45;
      }

      if (abbr.startsWith("CF")) {
        return 75;
      }

      return 35 + (Number(player.formationPlace) || 99) * 0.01;
    }

    function buildFormationRowXTemplate(formation) {
      const lines = parseFormationLines(formation);
      const template = [null];

      lines.forEach((count, rowIndex) => {
        const isFirst = rowIndex === 0;
        const isLast = rowIndex === lines.length - 1;
        const isSecondLast = rowIndex === lines.length - 2;

        if (count === 1) {
          template.push([50]);
          return;
        }

        if (count === 2) {
          if (isLast || (isSecondLast && lines[lines.length - 1] === 1)) {
            template.push([40, 60]);
            return;
          }

          template.push([34, 66]);
          return;
        }

        if (count === 3) {
          if (isFirst && lines[0] === 3) {
            template.push([28, 50, 72]);
            return;
          }

          if (isLast) {
            template.push([24, 50, 76]);
            return;
          }

          if (isSecondLast && lines[lines.length - 1] === 1) {
            template.push([32, 50, 68]);
            return;
          }

          template.push([30, 50, 70]);
          return;
        }

        if (count === 4) {
          if (isFirst) {
            template.push([14, 38, 62, 86]);
            return;
          }

          if (lines[0] === 3) {
            template.push([12, 34, 66, 88]);
            return;
          }

          template.push([10, 34, 66, 90]);
          return;
        }

        if (count === 5) {
          template.push([10, 26, 50, 74, 90]);
          return;
        }

        template.push(Array.from({ length: count }, (_, index) => {
          return 10 + (index / (count - 1)) * 80;
        }));
      });

      return template;
    }

    function lineupRowXPositions(formation, rowIndex, playerCount) {
      const template = buildFormationRowXTemplate(formation);
      const slots = template[rowIndex];

      if (Array.isArray(slots) && slots.length === playerCount) {
        return slots;
      }

      if (playerCount <= 1) {
        return [50];
      }

      if (playerCount === 2) {
        const isForwardRow = rowIndex === template.length - 1;
        return isForwardRow ? [40, 60] : [34, 66];
      }

      if (playerCount === 3) {
        if (rowIndex === 1) {
          return [28, 50, 72];
        }

        return [32, 50, 68];
      }

      const offset = rowIndex % 2 === 0 ? 0 : 4;
      return Array.from({ length: playerCount }, (_, index) => {
        if (playerCount === 4) {
          return [14 + offset, 38 + offset, 62 - offset, 86 - offset][index];
        }

        return 10 + (index / (playerCount - 1)) * 80;
      });
    }

    function assignLineupRowX(rowPlayers, formation, rowIndex) {
      const slots = lineupRowXPositions(formation, rowIndex, rowPlayers.length);
      const sorted = sortLineupRowPlayers(rowPlayers);

      sorted.forEach((player, index) => {
        player.__layoutX = slots[index] ?? slots[slots.length - 1] ?? 50;
      });

      return sorted;
    }

    function lineupSameRow(leftY, rightY) {
      return Math.abs(leftY - rightY) <= 4.5;
    }

    function enforceLineupRowSpacing(coords, starters, minGap = 21) {
      const entries = starters
        .map((player) => {
          const point = coords.get(player.id);
          if (!point) {
            return null;
          }

          return { id: player.id, x: point.x, y: point.y };
        })
        .filter(Boolean);
      const rows = new Map();

      entries.forEach((entry) => {
        const key = Math.round(entry.y * 10) / 10;
        if (!rows.has(key)) {
          rows.set(key, []);
        }

        rows.get(key).push(entry);
      });

      rows.forEach((row) => {
        if (row.length < 2) {
          return;
        }

        row.sort((left, right) => left.x - right.x);

        for (let index = 1; index < row.length; index += 1) {
          const gap = row[index].x - row[index - 1].x;
          if (gap >= minGap) {
            continue;
          }

          const push = (minGap - gap) / 2 + 0.4;
          row[index - 1].x = Math.max(8, row[index - 1].x - push);
          row[index].x = Math.min(92, row[index].x + push);
        }
      });

      entries.forEach((entry) => {
        coords.set(entry.id, { x: entry.x, y: entry.y });
      });
    }

    function staggerLineupColumns(coords, starters) {
      const entries = starters
        .map((player) => {
          const point = coords.get(player.id);
          if (!point) {
            return null;
          }

          return { id: player.id, x: point.x, y: point.y };
        })
        .filter(Boolean);
      const used = new Set();

      entries.forEach((seed) => {
        if (used.has(seed.id)) {
          return;
        }

        const column = entries
          .filter((entry) => (
            lineupSameRow(entry.y, seed.y)
            && Math.abs(entry.x - seed.x) <= 6
          ))
          .sort((left, right) => left.y - right.y);

        if (column.length < 2) {
          return;
        }

        column.forEach((entry) => used.add(entry.id));

        const shifts = column.length > 3
          ? [-10, -5, 0, 5, 10]
          : [-8, 0, 8];

        column.forEach((entry, index) => {
          const shift = shifts[index] ?? 0;
          entry.x = Math.max(8, Math.min(92, entry.x + shift));
        });
      });

      entries.forEach((entry) => {
        coords.set(entry.id, { x: entry.x, y: entry.y });
      });
    }

    const LINEUP_HALF_ZONE = {
      home: { gk: 8, attack: 42 },
      away: { gk: 92, attack: 58 }
    };

    function lineupPitchSideOrder(player) {
      const role = lineupRoleFromPosition(player.positionAbbr);
      const sideRank = {
        lb: 0,
        lwb: 0,
        lm: 0,
        aml: 0,
        lw: 0,
        stl: 0,
        lcb: 1,
        lcm: 1,
        dm: 1,
        cb: 2,
        cm: 2,
        am: 2,
        st: 2,
        rcb: 3,
        rcm: 3,
        amr: 3,
        rm: 3,
        rw: 3,
        str: 3,
        rb: 4,
        rwb: 4
      };

      if (role && sideRank[role] !== undefined) {
        return sideRank[role];
      }

      return Number(player.formationPlace) || 99;
    }

    function sortLineupRowPlayers(players) {
      return players.slice().sort((left, right) => {
        const orderDiff = lineupPitchSideOrder(left) - lineupPitchSideOrder(right);
        if (orderDiff !== 0) {
          return orderDiff;
        }

        return (left.formationPlace || 99) - (right.formationPlace || 99);
      });
    }

    function lineupRowYValues(rowCount, isHome) {
      const zone = isHome ? LINEUP_HALF_ZONE.home : LINEUP_HALF_ZONE.away;

      if (rowCount <= 1) {
        return [zone.gk];
      }

      const ys = [];
      for (let index = 0; index < rowCount; index += 1) {
        const ratio = index / (rowCount - 1);
        ys.push(zone.gk + ratio * (zone.attack - zone.gk));
      }

      return ys;
    }

    function nudgeLineupCollisions(coords, starters) {
      const entries = starters
        .map((player) => {
          const point = coords.get(player.id);
          if (!point) {
            return null;
          }

          return { id: player.id, x: point.x, y: point.y };
        })
        .filter(Boolean);

      for (let pass = 0; pass < 4; pass += 1) {
        for (let leftIndex = 0; leftIndex < entries.length; leftIndex += 1) {
          for (let rightIndex = leftIndex + 1; rightIndex < entries.length; rightIndex += 1) {
            const left = entries[leftIndex];
            const right = entries[rightIndex];

            if (!lineupSameRow(left.y, right.y)) {
              continue;
            }

            const gap = Math.abs(right.x - left.x);
            if (gap >= 20) {
              continue;
            }

            const push = (20 - gap) / 2 + 0.6;
            if (right.x >= left.x) {
              left.x = Math.max(10, left.x - push);
              right.x = Math.min(90, right.x + push);
            } else {
              left.x = Math.min(90, left.x + push);
              right.x = Math.max(10, right.x - push);
            }
          }
        }
      }

      entries.forEach((entry) => {
        coords.set(entry.id, { x: entry.x, y: entry.y });
      });
    }

    function resolveLineupRowPlayers(outfield, rowCount, rowIndex) {
      if (!outfield.length || rowCount <= 0) {
        return [];
      }

      if (outfield.length <= rowCount) {
        return rowIndex === 0 ? outfield.slice() : [];
      }

      const chunkSize = Math.ceil(outfield.length / rowCount);
      const start = rowIndex * chunkSize;
      return outfield.slice(start, start + chunkSize);
    }

    function layoutLineupCoords(starters, formation, isHome) {
      const lines = parseFormationLines(formation);
      const rowCounts = [1, ...lines];
      const yByRow = lineupRowYValues(rowCounts.length, isHome);
      const coords = new Map();
      const gkPlayers = starters.filter((player) => lineupRoleDepth(player, formation) === 0);
      const outfield = starters
        .filter((player) => lineupRoleDepth(player, formation) > 0)
        .sort((left, right) => {
          const depthDiff = lineupRoleDepth(left, formation) - lineupRoleDepth(right, formation);
          if (depthDiff !== 0) {
            return depthDiff;
          }

          return (left.formationPlace || 99) - (right.formationPlace || 99);
        });
      const expectedOutfield = lines.reduce((sum, count) => sum + count, 0);

      gkPlayers.forEach((player) => {
        coords.set(player.id, { x: 50, y: yByRow[0] });
      });

      if (outfield.length === expectedOutfield) {
        let cursor = 0;

        for (let rowIndex = 1; rowIndex < rowCounts.length; rowIndex += 1) {
          const rowPlayers = assignLineupRowX(
            outfield.slice(cursor, cursor + rowCounts[rowIndex]),
            formation,
            rowIndex
          );

          cursor += rowCounts[rowIndex];
          rowPlayers.forEach((player) => {
            coords.set(player.id, {
              x: player.__layoutX ?? 50,
              y: yByRow[rowIndex]
            });
            delete player.__layoutX;
          });
        }
      } else {
        for (let rowIndex = 1; rowIndex < rowCounts.length; rowIndex += 1) {
          const rowPlayers = assignLineupRowX(
            resolveLineupRowPlayers(outfield, lines.length, rowIndex - 1),
            formation,
            rowIndex
          );

          rowPlayers.forEach((player) => {
            coords.set(player.id, {
              x: player.__layoutX ?? 50,
              y: yByRow[rowIndex]
            });
            delete player.__layoutX;
          });
        }

        outfield.forEach((player) => {
          if (!coords.has(player.id)) {
            coords.set(player.id, { x: 50, y: yByRow[yByRow.length - 1] });
          }
        });
      }

      starters.forEach((player) => {
        if (!coords.has(player.id)) {
          coords.set(player.id, { x: 50, y: yByRow[yByRow.length - 1] });
        }
      });

      enforceLineupRowSpacing(coords, starters);
      nudgeLineupCollisions(coords, starters);
      staggerLineupColumns(coords, starters);
      enforceLineupRowSpacing(coords, starters);

      return coords;
    }

    function pitchPlayerBlockOrder(isHome, y) {
      if (isHome) {
        return y >= 36 ? "label-first" : "photo-first";
      }

      return y <= 64 ? "photo-first" : "label-first";
    }

    function getLineupCoords(player, isHome, coordsMap) {
      if (coordsMap?.has(player.id)) {
        return coordsMap.get(player.id);
      }

      const homeCoords = { x: 50, y: 28 };
      return isHome ? homeCoords : { x: homeCoords.x, y: 100 - homeCoords.y };
    }

    function parseRosterPlayer(player) {
      const athlete = player.athlete || {};
      const jerseyImages = Array.isArray(athlete.jerseyImages) ? athlete.jerseyImages : [];
      const photo = jerseyImages.find((item) => item.rel?.includes("dark"))?.href
        || jerseyImages.find((item) => item.rel?.includes("default"))?.href
        || athlete.headshot?.href
        || "";

      return {
        id: String(athlete.id || ""),
        jersey: player.jersey || "",
        name: athlete.displayName || athlete.shortName || "—",
        shortName: athlete.shortName || "",
        position: player.position?.displayName || player.position?.name || "",
        positionAbbr: player.position?.abbreviation || "",
        formationPlace: Number(player.formationPlace) || 0,
        starter: !!player.starter,
        subbedIn: !!player.subbedIn,
        subbedOut: !!player.subbedOut,
        photo
      };
    }

    function parseTeamRoster(rosterBlock) {
      const roster = rosterBlock?.roster || [];
      return {
        formation: rosterBlock?.formation || "",
        starters: roster
          .filter((player) => player.starter)
          .map(parseRosterPlayer)
          .sort((a, b) => (a.formationPlace || 99) - (b.formationPlace || 99)),
        subs: roster
          .filter((player) => !player.starter)
          .map(parseRosterPlayer)
          .sort((a, b) => Number(a.jersey) - Number(b.jersey))
      };
    }

    function positionLabelVi(positionName, abbr) {
      const key = String(abbr || positionName || "").toUpperCase();
      const labels = {
        G: "Thủ môn",
        GK: "Thủ môn",
        CD: "Hậu vệ",
        CB: "Hậu vệ",
        LB: "Hậu vệ",
        RB: "Hậu vệ",
        LM: "Hậu vệ",
        RM: "Hậu vệ",
        CM: "Tiền vệ",
        DM: "Tiền vệ",
        AM: "Tiền vệ",
        F: "Tiền đạo",
        CF: "Tiền đạo",
        ST: "Tiền đạo"
      };

      for (const token of Object.keys(labels)) {
        if (key.includes(token)) {
          return labels[token];
        }
      }

      return positionName || "Cầu thủ";
    }

    function lineupJerseyContent(player) {
      const number = player.jersey || "?";
      return `<div class="lineup-player-photo-fallback">${number}</div>`;
    }

    function buildPlayerEventsMap(events) {
      const byId = new Map();
      const ensure = (id) => {
        if (!id) {
          return null;
        }

        if (!byId.has(id)) {
          byId.set(id, { goals: 0, assists: 0, yellow: 0, red: 0, subInMin: null, subOutMin: null });
        }

        return byId.get(id);
      };

      (events || []).forEach((item) => {
        if (item.kind === "goal") {
          const bucket = ensure(item.athleteId);
          if (bucket) {
            bucket.goals += 1;
          }

          const assistBucket = ensure(item.assistId);
          if (assistBucket) {
            assistBucket.assists += 1;
          }
        }

        if (item.kind === "yellow") {
          const bucket = ensure(item.athleteId);
          if (bucket) {
            bucket.yellow += 1;
          }
        }

        if (item.kind === "red") {
          const bucket = ensure(item.athleteId);
          if (bucket) {
            bucket.red += 1;
          }
        }

        if (item.kind === "sub") {
          const inBucket = ensure(item.subInId);
          if (inBucket) {
            inBucket.subInMin = item.minute;
          }

          const outBucket = ensure(item.subOutId);
          if (outBucket) {
            outBucket.subOutMin = item.minute;
          }
        }
      });

      return byId;
    }

    function parseLineupsFromSummary(data) {
      const rosters = Array.isArray(data.rosters) ? data.rosters : [];
      if (!rosters.length) {
        return null;
      }

      const competitors = data.header?.competitions?.[0]?.competitors || [];
      const homeId = competitors.find((item) => item.homeAway === "home")?.team?.id;
      const awayId = competitors.find((item) => item.homeAway === "away")?.team?.id;
      const homeRoster = rosters.find((item) => String(item.team?.id) === String(homeId)) || rosters[0];
      const awayRoster = rosters.find((item) => String(item.team?.id) === String(awayId)) || rosters[1];

      return {
        home: parseTeamRoster(homeRoster),
        away: parseTeamRoster(awayRoster)
      };
    }

    function parseMatchSummary(data) {
      return {
        events: parseTimelineFromSummary(data),
        statsData: data,
        stats: parseStatsFromSummary(data),
        lineups: parseLineupsFromSummary(data)
      };
    }

    async function fetchMatchSummary(espnId) {
      if (!espnId) {
        return null;
      }

      const cached = summaryCache.get(espnId);
      const now = Date.now();
      if (cached && now - cached.fetchedAt < 12000) {
        return cached.data;
      }

      try {
        const response = await fetch(
          `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=${espnId}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(`ESPN summary ${response.status}`);
        }

        const data = parseMatchSummary(await response.json());
        summaryCache.set(espnId, { data, fetchedAt: now });
        return data;
      } catch (error) {
        return cached?.data || null;
      }
    }

    async function fetchMatchTimeline(espnId) {
      const summary = await fetchMatchSummary(espnId);
      return summary?.events || [];
    }

    function renderTimelineList(container, events) {
      if (!container) {
        return;
      }

      if (!events.length) {
        container.innerHTML = '<div class="timeline-empty">Chưa có diễn biến chi tiết.</div>';
        return;
      }

      container.innerHTML = events.map((item) => {
        return `
          <div class="timeline-item timeline-${item.kind}">
            <div class="timeline-minute">${item.minute}</div>
            <div class="timeline-body">
              <div class="timeline-label">${item.label}</div>
              <div class="timeline-text">${item.text}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function getKeyEvents(events) {
      return (events || []).filter((item) => item.kind === "goal" || item.kind === "yellow" || item.kind === "red");
    }

    function minuteSortKey(minute) {
      const raw = String(minute || "0").replace(/'/g, "");
      const extraMatch = raw.match(/\+(\d+)/);
      const base = Number.parseInt(raw.replace(/\+\d+/, ""), 10) || 0;
      const extra = extraMatch ? Number.parseInt(extraMatch[1], 10) : 0;
      return base * 100 + extra;
    }

    function eventIconClass(kind) {
      if (kind === "goal") {
        return "event-icon-goal";
      }

      if (kind === "yellow") {
        return "event-icon-yellow";
      }

      return "event-icon-red";
    }

    function eventLabel(kind) {
      if (kind === "goal") {
        return "Ghi bàn";
      }

      if (kind === "yellow") {
        return "Thẻ vàng";
      }

      return "Thẻ đỏ";
    }

    function resolveEventSide(item, match) {
      const text = String(item.text || "");
      let teamName = item.teamName || "";

      if (!teamName) {
        if (text.includes(`(${match.home})`)) {
          teamName = match.home;
        } else if (text.includes(`(${match.away})`)) {
          teamName = match.away;
        }
      }

      const normalized = normalizeEventTeam(teamName);
      const homeCanon = canonicalName(match.home);
      const awayCanon = canonicalName(match.away);

      if (normalized === homeCanon) {
        return "home";
      }

      if (normalized === awayCanon) {
        return "away";
      }

      if (teamName && canonicalName(teamName) === homeCanon) {
        return "home";
      }

      if (teamName && canonicalName(teamName) === awayCanon) {
        return "away";
      }

      return text.includes(match.home) ? "home" : "away";
    }

    function isOwnGoalEvent(item) {
      const text = `${item.text || ""} ${item.label || ""}`.toLowerCase();
      return text.includes("own goal") || text.includes("(og)");
    }

    function sortEventsByClock(events) {
      return events.slice().sort((a, b) => {
        const aClock = Number.isFinite(a.clockValue) ? a.clockValue : minuteSortKey(a.minute);
        const bClock = Number.isFinite(b.clockValue) ? b.clockValue : minuteSortKey(b.minute);
        return aClock - bClock;
      });
    }

    function formatGoalRow(item) {
      const player = item.player || extractPlayerFromText(item.text) || "—";
      const og = isOwnGoalEvent(item) ? " (OG)" : "";
      const minute = item.minute || "—";
      const assist = item.assistPlayer
        ? `<span class="match-event-goal-assist"><span class="event-icon event-icon-assist event-icon-xs" aria-hidden="true"></span>${item.assistPlayer}</span>`
        : "";

      return `
        <div class="match-event-goal-row">
          <span class="event-icon event-icon-goal event-icon-xs" aria-hidden="true"></span>
          <span class="match-event-goal-minute">${minute}</span>
          <div class="match-event-goal-main">
            <span class="match-event-goal-scorer">${player}${og}</span>
            ${assist}
          </div>
        </div>
      `;
    }

    function formatCardRow(item) {
      const player = item.player || extractPlayerFromText(item.text) || "—";
      const minute = item.minute || "—";
      return `${player} ${minute}`;
    }

    function renderCardBoard(cardEvents, match, kind) {
      const sorted = sortEventsByClock(cardEvents);
      const homeCards = sorted.filter((item) => resolveEventSide(item, match) === "home");
      const awayCards = sorted.filter((item) => resolveEventSide(item, match) === "away");
      const iconClass = kind === "yellow" ? "event-icon-yellow" : "event-icon-red";

      return `
        <div class="match-event-cards-board">
          <div class="match-event-cards-col is-home">
            ${homeCards.map((item) => `<div class="match-event-card-row">${formatCardRow(item)}</div>`).join("") || '<div class="match-event-card-row is-empty">—</div>'}
          </div>
          <div class="match-event-cards-icon">
            <span class="event-icon ${iconClass}" aria-hidden="true"></span>
          </div>
          <div class="match-event-cards-col is-away">
            ${awayCards.map((item) => `<div class="match-event-card-row">${formatCardRow(item)}</div>`).join("") || '<div class="match-event-card-row is-empty">—</div>'}
          </div>
        </div>
      `;
    }

    function renderMatchEventFeed(events, match, options = {}) {
      const { showHead = true } = options;
      const sorted = sortEventsByClock(getKeyEvents(events));
      const goals = sorted.filter((item) => item.kind === "goal");
      const yellows = sorted.filter((item) => item.kind === "yellow");
      const reds = sorted.filter((item) => item.kind === "red");

      if (!goals.length && !yellows.length && !reds.length) {
        return '<div class="timeline-empty">Chưa có bàn thắng hoặc thẻ.</div>';
      }

      const homeGoals = sortEventsByClock(goals.filter((item) => resolveEventSide(item, match) === "home"));
      const awayGoals = sortEventsByClock(goals.filter((item) => resolveEventSide(item, match) === "away"));

      const blocks = [];

      if (goals.length) {
        blocks.push(`
          <div class="match-event-goals-board">
            <div class="match-event-goals-col is-home">
              ${homeGoals.map((item) => formatGoalRow(item)).join("") || '<div class="match-event-goal-row">—</div>'}
            </div>
            <div class="match-event-goals-col is-away">
              ${awayGoals.map((item) => formatGoalRow(item)).join("") || '<div class="match-event-goal-row">—</div>'}
            </div>
          </div>
        `);
      }

      if (yellows.length) {
        blocks.push(renderCardBoard(yellows, match, "yellow"));
      }

      if (reds.length) {
        blocks.push(renderCardBoard(reds, match, "red"));
      }

      const head = showHead ? '<div class="match-event-head">Sự kiện trận đấu</div>' : "";

      return `
        <div class="match-event-section">
          ${head}
          <div class="match-event-feed">${blocks.join("")}</div>
        </div>
      `;
    }

    async function loadMatchTimelineForLive(match) {
      if (!isLiveMatch(match) || !liveTimelineListEl) {
        return;
      }

      const summary = await fetchDisplayMatchSummary(match);
      if (liveTimelineListEl) {
        liveTimelineListEl.innerHTML = renderMatchEventFeed(summary?.events || [], match, { showHead: false });
      }

      const scores = getLiveDisplayScores(match);
      if (liveHomeScoreEl && liveAwayScoreEl) {
        liveHomeScoreEl.textContent = scores.home;
        liveAwayScoreEl.textContent = scores.away;
      }
    }

    function renderStatsPanel(stats, match, events, statsData) {
      const keyEventsHtml = renderMatchEventFeed(events || [], match);
      const resolvedStats = statsData ? parseStatsFromSummary(statsData, match) : stats;
      const homeShort = team(match.home).short;
      const awayShort = team(match.away).short;

      if (!resolvedStats?.rows?.length) {
        return keyEventsHtml;
      }

      const rows = resolvedStats.rows.map((row) => {
        return `
          <div class="detail-stat-row">
            <div class="detail-stat-value ${row.homeBest}">${row.home}</div>
            <div class="detail-stat-label">${row.label}</div>
            <div class="detail-stat-value ${row.awayBest}">${row.away}</div>
          </div>
        `;
      }).join("");

      return `
        ${keyEventsHtml}
        <div class="detail-stats-head">Thống kê đội · ${homeShort} – ${awayShort}</div>
        <div class="detail-stats-table">${rows}</div>
      `;

    function renderLineupTeamBar(teamName, formation, isHome) {
      const sideClass = isHome ? "is-home" : "is-away";
      return `
        <div class="lineup-team-bar ${sideClass}">
          <div class="lineup-team-meta">
            <span class="flag-img" style="${flagStyle(teamName)}" aria-hidden="true"></span>
            <span class="lineup-team-name">${teamName}</span>
          </div>
          ${formation ? `<span class="lineup-formation">${formation}</span>` : ""}
        </div>

    function renderBenchColHeader(teamName) {
      return `
        <div class="lineup-bench-col-head">
          <span class="flag-img" style="${flagStyle(teamName)}" aria-hidden="true"></span>
          <span>${teamName}</span>
        </div>
      `;
    }

    function formatPitchPlayerName(player) {
      const fullName = String(player.name || "—").trim();
      const shortName = String(player.shortName || "").trim();
      const source = shortName || fullName;
      const parts = source.split(/\s+/).filter(Boolean);

      if (parts.length <= 1) {
        return source.slice(0, 10);
      }

      const lastName = parts[parts.length - 1];
      if (lastName.length > 10) {
        return lastName.slice(0, 10);
      }

      const compact = parts.length > 1
        ? `${parts[0].replace(/\.$/, "")[0]}. ${lastName}`
        : lastName;

      return compact.length > 11 ? compact.slice(0, 11) : compact;
    }

    function renderPitchPlayer(player, isHome, coordsMap, eventsMap) {
      const coords = getLineupCoords(player, isHome, coordsMap);
      const sideClass = isHome ? "is-home" : "is-away";
      const events = eventsMap.get(player.id) || { goals: 0, assists: 0, yellow: 0, red: 0, subInMin: null, subOutMin: null };
      const icons = [];

      for (let i = 0; i < events.goals; i += 1) {
        icons.push('<span class="event-icon event-icon-goal" aria-hidden="true"></span>');
      }

      for (let i = 0; i < events.assists; i += 1) {
        icons.push('<span class="event-icon event-icon-assist" aria-hidden="true"></span>');
      }

      if (events.yellow) {
        icons.push('<span class="event-icon event-icon-yellow" aria-hidden="true"></span>');
      }

      if (events.red) {
        icons.push('<span class="event-icon event-icon-red" aria-hidden="true"></span>');
      }

      if (player.subbedOut || events.subOutMin) {
        icons.push('<span class="lineup-sub-icon lineup-sub-out" aria-hidden="true">↓</span>');
      }

      const photoBlock = `
          <div class="lineup-player-photo">
            ${lineupJerseyContent(player)}
          </div>`;
      const labelBlock = `
          <div class="lineup-player-label">
            <span class="lineup-player-name" title="${player.name}">${formatPitchPlayerName(player)}</span>
            ${icons.length ? `<div class="lineup-player-icons">${icons.join("")}</div>` : ""}
          </div>`;
      const blockOrder = pitchPlayerBlockOrder(isHome, coords.y);
      const inner = blockOrder === "label-first"
        ? labelBlock + photoBlock
        : photoBlock + labelBlock;

      return `
        <div class="lineup-player-dot ${sideClass}" style="left:${coords.x}%;top:${coords.y}%;z-index:${Math.round(coords.y)};">
          ${inner}
        </div>
      `;
    }

    function renderBenchPlayer(player, eventsMap) {
      const events = eventsMap.get(player.id) || { goals: 0, assists: 0, yellow: 0, red: 0, subInMin: null, subOutMin: null };
      const icons = [];

      for (let i = 0; i < events.goals; i += 1) {
        icons.push('<span class="event-icon event-icon-goal" aria-hidden="true"></span>');
      }

      for (let i = 0; i < events.assists; i += 1) {
        icons.push('<span class="event-icon event-icon-assist" aria-hidden="true"></span>');
      }

      if (events.yellow) {
        icons.push('<span class="event-icon event-icon-yellow" aria-hidden="true"></span>');
      }

      if (events.red) {
        icons.push('<span class="event-icon event-icon-red" aria-hidden="true"></span>');

      if (player.subbedIn || events.subInMin) {
        icons.push('<span class="lineup-sub-icon lineup-sub-in" aria-hidden="true">↑</span>');
      }

      const minute = events.subInMin ? `<span class="lineup-bench-minute">${events.subInMin}</span>` : "";

      return `
        <div class="lineup-bench-row">
          <div class="lineup-bench-photo">${lineupJerseyContent(player)}</div>
          <div class="lineup-bench-main">
            <div class="lineup-bench-name">${player.jersey ? `<span style="opacity:0.72">${player.jersey}</span> ` : ""}${player.name}</div>
            <div class="lineup-bench-pos">${positionLabelVi(player.position, player.positionAbbr)}</div>
          </div>
          <div class="lineup-bench-events">${icons.join("")}${minute}</div>
        </div>
      `;
    }

    function renderLineupsPanel(lineups, match, events) {
      const homeStarters = lineups?.home?.starters || [];
      const awayStarters = lineups?.away?.starters || [];

      if (!homeStarters.length && !awayStarters.length) {
        return '<div class="timeline-empty">Chưa có đội hình xuất phát.</div>';
      }

      const eventsMap = buildPlayerEventsMap(events);
      const homeCoords = layoutLineupCoords(homeStarters, lineups.home?.formation, true);
      const awayCoords = layoutLineupCoords(awayStarters, lineups.away?.formation, false);
      const homePitch = homeStarters.map((player) => renderPitchPlayer(player, true, homeCoords, eventsMap)).join("");
      const awayPitch = awayStarters.map((player) => renderPitchPlayer(player, false, awayCoords, eventsMap)).join("");
      const homeBench = (lineups.home?.subs || []).map((player) => renderBenchPlayer(player, eventsMap)).join("")
        || '<div class="lineup-bench-row"><div class="lineup-bench-main"><div class="lineup-bench-name">Chưa có dữ liệu.</div></div></div>';
      const awayBench = (lineups.away?.subs || []).map((player) => renderBenchPlayer(player, eventsMap)).join("")
        || '<div class="lineup-bench-row"><div class="lineup-bench-main"><div class="lineup-bench-name">Chưa có dữ liệu.</div></div></div>';

      return `
        <div class="lineup-board" style="${lineupKitStyleVars(match.home, match.away)}">
          <div class="lineup-pitch-wrap">
            ${renderLineupTeamBar(match.home, lineups.home?.formation, true)}
            <div class="lineup-pitch-field">${homePitch}${awayPitch}</div>
            ${renderLineupTeamBar(match.away, lineups.away?.formation, false)}

          <div class="lineup-bench-grid">
            <div class="lineup-bench-col is-home">

            <div class="lineup-bench-col is-away">
              ${renderBenchColHeader(match.away)}

            </div>

    function switchDetailTab(tab) {
      if (!selectedMatchKey || tab === detailTab) {

    function renderDetailTabPanel(summary, match, tab) {

    async function renderMatchDetail(matchKey, tab = detailTab) {

    function getStandingsScores(match) {
      if (match.homeScore !== null && match.awayScore !== null) {
        return { home: match.homeScore, away: match.awayScore };
      }

      return null;
    }

    function buildStandings() {
      const table = {};

      groups.forEach((group) => {
        table[group.name] = {};
        group.teams.forEach((teamName) => {
          table[group.name][teamName] = {
            name: teamName,
            played: 0,
            wins: 0,
            draws: 0,
            losses: 0,
            gf: 0,
            ga: 0,
            gd: 0,
            points: 0
          };
        });
      });

      mergeLiveSchedule().forEach((match) => {
        const scores = getStandingsScores(match);
        if (!scores) {
          return;
        }

        const groupTable = table[match.group];
        if (!groupTable || !groupTable[match.home] || !groupTable[match.away]) {
          return;
        }

        const home = groupTable[match.home];
        const away = groupTable[match.away];
        const homeScore = scores.home;
        const awayScore = scores.away;
        const isLive = match.isProvisional || match.rawInProgress;
        const isFinal = (match.completed || match.rawCompleted) && !match.rawInProgress
          && match.homeScore !== null && match.awayScore !== null;

        if (isFinal) {
          home.played += 1;
          away.played += 1;
          home.gf += homeScore;
          home.ga += awayScore;
          away.gf += awayScore;
          away.ga += homeScore;

          if (homeScore > awayScore) {
            home.wins += 1;
            away.losses += 1;
            home.points += 3;
          } else if (homeScore < awayScore) {
            away.wins += 1;
            home.losses += 1;
            away.points += 3;
          } else {
            home.draws += 1;
            away.draws += 1;
            home.points += 1;
            away.points += 1;
          }
        } else if (isLive) {
          home.gf += homeScore;
          home.ga += awayScore;
          away.gf += awayScore;
          away.ga += homeScore;

          if (homeScore > awayScore) {
            home.points += 3;
          } else if (homeScore < awayScore) {
            away.points += 3;
          } else {
            home.points += 1;
            away.points += 1;
          }
        }
      });

      Object.values(table).forEach((groupTable) => {
        Object.values(groupTable).forEach((row) => {
          row.gd = row.gf - row.ga;
        });
      });

      return table;
    }

    function sortedGroupRows(group, standings) {
      return group.teams
        .map((teamName, index) => ({ ...standings[group.name][teamName], index }))
        .sort((a, b) => (
          b.points - a.points ||
          b.gd - a.gd ||
          b.gf - a.gf ||
          a.index - b.index
        ));
    }

    function formatGoalDiff(value) {
      return value > 0 ? `+${value}` : String(value);
    }

    function buildEspnScoreboardUrl() {
      const now = new Date();
      const tournamentStartMs = schedule.reduce(
        (earliest, match) => Math.min(earliest, Date.parse(match.utc)),
        Date.parse(schedule[0].utc)
      );
      const start = new Date(tournamentStartMs);
      start.setUTCHours(0, 0, 0, 0);
      const end = new Date(now);
      end.setDate(end.getDate() + 7);
      const fmt = (date) => date.toISOString().slice(0, 10).replace(/-/g, "");
      return `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${fmt(start)}-${fmt(end)}&limit=200`;
    }

    const espnAbbreviationAliases = {
      BIH: "Bosnia and Herzegovina",
      CPV: "Cabo Verde",
      COD: "DR Congo",
      CUW: "Curacao",
      KOR: "Korea Republic",
      TUR: "Turkey"
    };

    function normalizeEspnTeam(name, abbreviation) {
      return espnAbbreviationAliases[abbreviation] || liveNameAliases[name] || name;
    }

    function transformEspnScoreboard(data) {
      const events = Array.isArray(data.events) ? data.events : [];

      return {
        source: "ESPN",
        sourceUrl: buildEspnScoreboardUrl(),
        updatedAt: new Date().toISOString(),
        events: events.map((event) => {
          const competition = event.competitions && event.competitions[0];
          const competitors = competition && Array.isArray(competition.competitors)
            ? competition.competitors
            : [];
          const home = competitors.find((competitor) => competitor.homeAway === "home");
          const away = competitors.find((competitor) => competitor.homeAway === "away");

          if (!home || !away) {
            return null;
          }

          return {
            id: String(event.id || ""),
            name: String(event.name || ""),
            shortName: String(event.shortName || ""),
            utc: String(event.date || ""),
            statusState: String(event.status?.type?.state || "pre"),
            statusName: String(event.status?.type?.name || ""),
            statusText: String(event.status?.type?.description || "Đã lên lịch"),
            statusDetail: String(event.status?.type?.detail || ""),
            displayClock: String(event.status?.displayClock || event.status?.type?.detail || ""),
            statusClock: Number(event.status?.clock) || 0,
            statusPeriod: Number(event.status?.period) || 1,
            statusClockUpdatedAt: Date.now(),
            completed: Boolean(event.status?.type?.completed),
            venue: String(competition?.venue?.fullName || ""),
            home: normalizeEspnTeam(home.team?.displayName || "", home.team?.abbreviation || ""),
            away: normalizeEspnTeam(away.team?.displayName || "", away.team?.abbreviation || ""),
            homeScore: readCompetitorScore(home),
            awayScore: readCompetitorScore(away)
          };
        }).filter(Boolean)
      };
    }

    function loadBundledLiveData() {
      const script = document.createElement("script");
      const previous = document.getElementById("liveDataScript");

      if (previous) {
        previous.remove();
      }

      script.id = "liveDataScript";
      script.src = `worldcup-live-data.js?ts=${Date.now()}`;
      script.onload = () => {
        if (window.WORLDCUP_LIVE_DATA && Array.isArray(window.WORLDCUP_LIVE_DATA.events)) {
          liveData = window.WORLDCUP_LIVE_DATA;
          if (dataStatusEl) {
            dataStatusEl.textContent = formatDataStatus("local");
          }
          refreshLiveViews();
          scheduleLiveRefresh();
        }
      };
      script.onerror = () => {
        if (dataStatusEl) {
          dataStatusEl.textContent = formatDataStatus("local");
        }
        scheduleLiveRefresh();
      };
      document.body.appendChild(script);
    }

    async function loadLiveData(retry = true) {
      try {
        const response = await fetch(buildEspnScoreboardUrl(), { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`ESPN returned ${response.status}`);
        }

        liveData = transformEspnScoreboard(await response.json());

        if (dataStatusEl) {
          dataStatusEl.textContent = formatDataStatus("ESPN");
        }

        lastLiveScoresKey = getLiveScoresKey();
        refreshLiveViews();
        scheduleLiveRefresh();
      } catch (error) {
        if (retry) {
          window.setTimeout(() => loadLiveData(false), 2000);
          return;
        }

        loadBundledLiveData();
        scheduleLiveRefresh();
      }
    }

    const standingsGroupsPerPage = 4;
    let standingsPage = 0;

    function renderStandings() {
      const pageCount = Math.ceil(groups.length / standingsGroupsPerPage);
      const start = standingsPage * standingsGroupsPerPage;
      const visibleGroups = groups.slice(start, start + standingsGroupsPerPage);
      const standings = buildStandings();
      const liveTeams = getLiveTeamsInStandings();
      const provisionalTeams = getProvisionalPointTeams();
      const firstGroup = visibleGroups[0].name.replace("Group ", "");
      const lastGroup = visibleGroups[visibleGroups.length - 1].name.replace("Group ", "");

      if (standingsKickerEl) {
        standingsKickerEl.textContent = `BẢNG ${firstGroup}–${lastGroup}`;
      }

      document.querySelectorAll(".group-button").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.page) === standingsPage);
      });

      standingsViewEl.innerHTML = `
        <div class="standings-groups">
          ${visibleGroups.map((group) => {
        const groupRows = sortedGroupRows(group, standings);
        const played = groupRows.reduce((sum, row) => sum + row.played, 0);
        const rows = groupRows.map((row) => {
          const liveBadge = liveTeams.has(row.name) ? '<span class="standings-provisional">LIVE</span>' : "";
          const provisionalClass = provisionalTeams.has(row.name) ? " is-provisional" : "";
          return `
            <div class="table-row">
              <div class="team-cell">
                <span class="flag-img" style="${flagStyle(row.name)}" aria-hidden="true"></span>
                <span class="team-name">${row.name}${liveBadge}</span>
              </div>
              <div class="num">${row.wins}</div>
              <div class="num">${row.draws}</div>
              <div class="num">${row.losses}</div>
              <div class="num${provisionalClass}">${formatGoalDiff(row.gd)}</div>
              <div class="num${provisionalClass}">${row.points}</div>
            </div>
          `;
        }).join("");

        return `
          <section class="group-card is-clickable" data-group="${group.name}" tabindex="0" role="button" aria-label="Xem lịch sử ${formatGroupName(group.name)}">
            <div class="group-head">
              <div class="group-name">${formatGroupName(group.name)}</div>
              <div class="group-status">${played ? `${played / 2}/6 trận` : "Chưa đấu"}</div>
            </div>
            <div class="table-row header">
              <div>ĐỘI</div>
              <div class="num" title="Thắng">W</div>
              <div class="num" title="Hòa">D</div>
              <div class="num" title="Bại">L</div>
              <div class="num">HS</div>
              <div class="num">ĐIỂM</div>
            </div>
            ${rows}
          </section>
        `;
      }).join("")}
        </div>
        <button class="player-stats-entry" type="button" data-action="open-player-stats">
          Top Goals · Top Assists
        </button>
      `;
    }

    function setStandingsPage(page) {
      const pageCount = Math.ceil(groups.length / standingsGroupsPerPage);
      standingsPage = Math.max(0, Math.min(pageCount - 1, page));
      showStandingsView();
    }

    function isUpcomingOrLiveMatch(match, now) {
      return !match.completed && (match.inProgress || match.rawInProgress || Date.parse(match.utc) > now);
    }

    function matchPriority(match) {
      if (match.inProgress || match.rawInProgress) {
        return 0;
      }

      return 1;
    }

    function nextMatches(now) {
      return mergeLiveSchedule()
        .filter((match) => isUpcomingOrLiveMatch(match, now))
        .sort((a, b) => {
          const priorityDiff = matchPriority(a) - matchPriority(b);
          if (priorityDiff !== 0) {
            return priorityDiff;
          }

          return Date.parse(a.utc) - Date.parse(b.utc);
        })
        .slice(0, 5);
    }

    function getCenterMatch(matches) {
      if (centerMatchKey) {
        const selected = matches.find((match) => matchKey(match.home, match.away, match.utc) === centerMatchKey);
        if (selected) {
          return selected;
        }

        centerMatchKey = "";
      }

      return matches.find((match) => match.inProgress || match.rawInProgress) || matches[0] || null;
    }

    function renderFixtures(matches, activeKey) {
      if (matches.length === 0) {
        fixturesEl.innerHTML = '<div class="empty-state">Vòng bảng đã kết thúc.</div>';
        return;
      }

      fixturesEl.innerHTML = matches.map((match) => {
        const home = team(match.home);
        const away = team(match.away);
        const key = matchKey(match.home, match.away, match.utc);
        const isSelected = key === activeKey;
        return `
          <article class="match-card${isLiveMatch(match) ? " is-live" : ""}${isSelected ? " is-selected" : ""}" data-match-key="${key}" role="button" tabindex="0" aria-pressed="${isSelected}">
            <div class="match-row">
              <div class="match-team">
                <span class="flag-img" style="${flagStyle(match.home)}" aria-hidden="true"></span>
                <span class="match-team-name">${match.home}</span>
              </div>
              <div class="match-v">${scoreText(match)}</div>
              <div class="match-team away">
                <span class="match-team-name">${match.away}</span>
                <span class="flag-img" style="${flagStyle(match.away)}" aria-hidden="true"></span>
              </div>
            </div>
            <div class="match-time">
              <span>${formatGroupName(match.group)}</span>
              <span>${statusText(match)}</span>
            </div>
            <div class="match-time">
              <span>${match.venue}</span>
              <span>${home.short} - ${away.short}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function updateNextMatch(match) {
      if (!match) {
        homeFlagEl.style.removeProperty("--flag");
        awayFlagEl.style.removeProperty("--flag");
        homeNameEl.textContent = "World Cup";
        awayNameEl.textContent = "2026";
        matchGroupEl.textContent = "Hết giờ";
        matchTitleEl.textContent = "Vòng bảng đã kết thúc";
        matchTimeEl.textContent = "Không còn trận sắp diễn ra";
        setStageMode(false);
        return;
      }

      const home = team(match.home);
      const away = team(match.away);
      homeFlagEl.style.setProperty("--flag", `url('${flagPath(match.home)}')`);
      awayFlagEl.style.setProperty("--flag", `url('${flagPath(match.away)}')`);
      homeNameEl.textContent = match.home;
      awayNameEl.textContent = match.away;
      matchGroupEl.textContent = isLiveMatch(match)
        ? `${formatGroupName(match.group)} · TRỰC TIẾP`
        : formatGroupName(match.group);
      matchTitleEl.textContent = isLiveMatch(match)
        ? `${match.home} vs ${match.away}`
        : `${match.home} ${scoreText(match)} ${match.away}`;
      matchTimeEl.textContent = isLiveMatch(match)
        ? `${liveMinuteText(match)} · ${match.venue}`
        : `Giờ VN ${formatVietnamTime(match.utc)} · ${match.venue}`;
    }

    function updateCountdown() {
      const now = Date.now();
      const matches = nextMatches(now);
      const next = getCenterMatch(matches);
      const activeKey = next ? matchKey(next.home, next.away, next.utc) : "";

      renderFixtures(matches, activeKey);
      updateNextMatch(next);
      updateLiveBoard(next);

      const scoresKey = getLiveScoresKey();
      if (scoresKey !== lastLiveScoresKey) {
        lastLiveScoresKey = scoresKey;
        refreshLiveViews({ skipCountdown: true });
      }

      if (next && isLiveMatch(next)) {
        renderLocalClock();
        return;
      }

      const target = next && Date.parse(next.utc) > now ? Date.parse(next.utc) : now;
      const remaining = Math.max(0, target - now);
      const totalSeconds = Math.floor(remaining / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      hoursEl.textContent = pad(hours, 2);
      minutesEl.textContent = pad(minutes, 2);
      secondsEl.textContent = pad(seconds, 2);

      renderLocalClock();
    }

    renderStandings();
    startTaskbarInsetWatcher();
    renderLocalClock();
    loadLiveData();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        loadLiveData();
      }
    });
    groupControlsEl.addEventListener("click", (event) => {
      const button = event.target.closest(".group-button");
      if (!button) {
        return;
      }

      setStandingsPage(Number(button.dataset.page));
    });

    standingsScrollEl.addEventListener("click", (event) => {
      const groupCard = event.target.closest(".group-card[data-group]");
      if (groupCard && standingsOverlay === "standings") {
        openGroupHistory(groupCard.dataset.group);
        return;
      }

      const playerStatsEntry = event.target.closest('[data-action="open-player-stats"]');
      if (playerStatsEntry && standingsOverlay === "standings") {
        openPlayerStats("goals");
        return;
      }

      const playerTabButton = event.target.closest("[data-player-tab]");
      if (playerTabButton && standingsOverlay === "players") {
        switchPlayerStatsTab(playerTabButton.dataset.playerTab);
        return;
      }

      const historyRow = event.target.closest(".history-match-row[data-match-key]");
      if (historyRow) {
        openMatchDetail(historyRow.dataset.matchKey);
        return;
      }

      const backStandings = event.target.closest('[data-action="back-standings"]');
      if (backStandings) {
        showStandingsView();
        return;
      }

      const backHistory = event.target.closest('[data-action="back-history"]');
      if (backHistory && selectedGroupName) {
        openGroupHistory(selectedGroupName);
        return;
      }

      const detailTabButton = event.target.closest("[data-detail-tab]");
      if (detailTabButton && standingsOverlay === "detail") {
        switchDetailTab(detailTabButton.dataset.detailTab);
      }
    });

    standingsScrollEl.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }

      const groupCard = event.target.closest(".group-card[data-group]");
      if (groupCard && standingsOverlay === "standings") {
        event.preventDefault();
        openGroupHistory(groupCard.dataset.group);
      }
    });

    fixturesEl.addEventListener("click", (event) => {
      const card = event.target.closest(".match-card[data-match-key]");
      if (!card) {
        return;
      }

      centerMatchKey = card.dataset.matchKey;
      updateCountdown();
    });

    fixturesEl.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }

      const card = event.target.closest(".match-card[data-match-key]");
      if (!card) {
        return;
      }

      event.preventDefault();
      centerMatchKey = card.dataset.matchKey;
      updateCountdown();
    });

    setInterval(updateCountdown, 1000);

    const canvas = document.getElementById("motion");
    const context = canvas.getContext("2d");
    const particles = [];
    const colors = ["#ffd166", "#6ae9ff", "#ff4d5f", "#f8fbff", "#18a05f"];
    let width = 0;
    let height = 0;
    let pixelRatio = 1;

    function resizeCanvas() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * pixelRatio);
      canvas.height = Math.floor(height * pixelRatio);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      seedParticles();
    }

    function seedParticles() {
      particles.length = 0;
      const count = Math.min(150, Math.max(70, Math.floor((width * height) / 15000)));
      for (let index = 0; index < count; index += 1) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: 0.8 + Math.random() * 2.4,
          speed: 0.25 + Math.random() * 0.75,
          drift: -0.22 + Math.random() * 0.44,
          alpha: 0.16 + Math.random() * 0.48,
          color: colors[Math.floor(Math.random() * colors.length)],
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function drawNet(time) {
      const horizon = height * 0.52;
      context.save();
      context.globalAlpha = 0.16;
      context.strokeStyle = "#f8fbff";
      context.lineWidth = 1;

      for (let x = -width; x < width * 2; x += 78) {
        context.beginPath();
        context.moveTo(x + Math.sin(time * 0.0004 + x) * 8, horizon);
        context.lineTo(width / 2 + (x - width / 2) * 0.38, height);
        context.stroke();
      }

      for (let y = horizon; y < height; y += 56) {
        const scale = (y - horizon) / Math.max(1, height - horizon);
        context.beginPath();
        context.moveTo(width * (0.06 + scale * 0.18), y);
        context.lineTo(width * (0.94 - scale * 0.18), y + Math.sin(time * 0.0008 + y) * 2);
        context.stroke();
      }

      context.restore();
    }

    function drawParticles(time) {
      for (const particle of particles) {
        particle.y -= particle.speed;
        particle.x += particle.drift + Math.sin(time * 0.001 + particle.phase) * 0.18;

        if (particle.y < -8) {
          particle.y = height + 8;
          particle.x = Math.random() * width;
        }

        if (particle.x < -8) {
          particle.x = width + 8;
        }

        if (particle.x > width + 8) {
          particle.x = -8;
        }

        context.save();
        context.globalAlpha = particle.alpha * (0.7 + Math.sin(time * 0.002 + particle.phase) * 0.3);
        context.fillStyle = particle.color;
        context.beginPath();
        context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }
    }

    function drawOrbit(time) {
      const centerX = width * 0.5;
      const centerY = height * 0.49;
      const radiusX = Math.min(width * 0.28, 320);
      const radiusY = Math.min(height * 0.16, 115);
      const ballX = centerX + Math.cos(time * 0.00038) * radiusX;
      const ballY = centerY + Math.sin(time * 0.00038) * radiusY;

      context.save();
      context.lineWidth = 2;
      context.strokeStyle = "rgba(255, 209, 102, 0.16)";
      context.beginPath();
      context.ellipse(centerX, centerY, radiusX, radiusY, -0.16, 0, Math.PI * 2);
      context.stroke();

      const glow = context.createRadialGradient(ballX, ballY, 0, ballX, ballY, 42);
      glow.addColorStop(0, "rgba(255, 209, 102, 0.7)");
      glow.addColorStop(0.22, "rgba(255, 209, 102, 0.26)");
      glow.addColorStop(1, "rgba(255, 209, 102, 0)");
      context.fillStyle = glow;
      context.beginPath();
      context.arc(ballX, ballY, 42, 0, Math.PI * 2);
      context.fill();
      context.restore();
    }

    function animate(time) {
      context.clearRect(0, 0, width, height);
      drawNet(time);
      drawOrbit(time);
      drawParticles(time);
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resizeCanvas, { passive: true });
    resizeCanvas();
    requestAnimationFrame(animate);
  </script>
</body>
</html>

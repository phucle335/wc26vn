<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cup 2026 — Lịch thi đấu & Live</title>
  <style>
    :root {
      color-scheme: dark;
      --taskbar-inset: 0px;
      --taskbar-inset-right: 0px;
      --ink: #ffffff;
      --muted: rgba(240, 245, 255, 0.88);
      --dim: rgba(220, 228, 240, 0.72);
      --line: rgba(255, 255, 255, 0.18);
      --panel: rgba(5, 16, 28, 0.38);
      --panel-strong: rgba(7, 28, 42, 0.52);
      --read-shadow: 0 1px 2px rgba(0, 0, 0, 0.95), 0 2px 10px rgba(0, 0, 0, 0.8);
      --glass-card: rgba(4, 18, 24, 0.34);
      --green-a: #06291d;
      --green-b: #0a5135;
      --gold: #ffd166;
      --red: #ff4d5f;
      --cyan: #6ae9ff;
      --blue: #10285d;
      --shadow: rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05090d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
    }

    body {
      cursor: default;
    }

    .wallpaper {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 560px;
      isolation: isolate;
      background: #05090d;
    }

    .bg-poster {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #05090d;
    }

    /* Làm mờ viền khi ảnh dọc không phủ hết màn hình ngang */
    .bg-poster::before {
      content: "";
      position: absolute;
      inset: -4%;
      background: url("assets/bg-poster.jpg") center / cover no-repeat;
      filter: blur(28px) brightness(0.42) saturate(1.1);
      transform: scale(1.08);
      pointer-events: none;
    }

    .bg-poster img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      image-rendering: auto;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform: translateZ(0);
      pointer-events: none;
      user-select: none;
    }

    /* Chỉ làm tối nhẹ phía dưới để chữ widget đọc được */
    .bg-poster::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.08) 55%,
        rgba(0, 0, 0, 0.28) 100%
      );
      pointer-events: none;
    }

    .wallpaper::before,
    .wallpaper::after {
      display: none;
    }

    #motion {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      opacity: 0.34;
      pointer-events: none;
    }

    .light {
      position: absolute;
      top: -16%;
      width: 26%;
      height: 90%;
      z-index: -2;
      filter: blur(0.5rem);
      opacity: 0.48;
      mix-blend-mode: screen;
      transform-origin: top center;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.34), rgba(106, 233, 255, 0.08) 48%, transparent);
      clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%);
      animation: sweep 9s ease-in-out infinite;
    }

    .light.left {
      left: 3%;
      transform: rotate(18deg);
    }

    .light.right {
      right: 3%;
      transform: rotate(-18deg);
      animation-delay: -4s;
    }

    .halo {
      position: absolute;
      left: 50%;
      top: 49%;
      width: 38rem;
      height: 38rem;
      z-index: -2;
      border-radius: 50%;
      border: 0.1rem solid rgba(255, 255, 255, 0.09);
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 5rem rgba(106, 233, 255, 0.15),
        inset 0 0 5rem rgba(255, 209, 102, 0.10);
      animation: pulse 4.8s ease-in-out infinite;
    }

    .ribbon {
      position: absolute;
      width: 18rem;
      height: 0.5rem;
      border-radius: 999rem;
      z-index: 0;
      opacity: 0.82;
      filter: drop-shadow(0 0 1.1rem currentColor);
      animation: floatRibbon 7s ease-in-out infinite;
    }

    .ribbon.one {
      left: 10%;
      top: 27%;
      color: var(--red);
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      transform: rotate(-18deg);
    }

    .ribbon.two {
      right: 7%;
      top: 29%;
      color: var(--gold);
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      transform: rotate(16deg);
      animation-delay: -1.8s;
    }

    .ribbon.three {
      left: 16%;
      bottom: 20%;
      color: var(--cyan);
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      transform: rotate(11deg);
      animation-delay: -3.2s;
    }

    .dashboard {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: 24rem minmax(34rem, 1fr) 25rem;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      height: 100%;
      padding: 3rem 2rem 4.4rem 7.25rem;
    }

    .panel {
      width: 100%;
      align-self: center;
      border: 0.1rem solid var(--line);
      border-radius: 0.45rem;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03)),
        var(--panel);
      box-shadow:
        0 0.6rem 2rem rgba(0, 0, 0, 0.22),
        inset 0 0 1.5rem rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(0.55rem);
    }

    .panel-title,
    .panel-kicker,
    .group-name,
    .team-name,
    .match-team-name,
    .table-row {
      text-shadow: var(--read-shadow);
    }

    .standings-panel {
      display: flex;
      flex-direction: column;
      height: min(54rem, calc(100vh - 6rem));
      min-height: 36rem;
      padding: 1rem;
    }

    .standings-panel .standings-scroll {
      margin-top: 0.9rem;
    }

    .fixtures-panel {
      min-height: 36rem;
      padding: 1rem;
    }

    .panel-head {
      display: flex;
      flex-shrink: 0;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 0.1rem solid rgba(255, 255, 255, 0.12);
    }

    .panel-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .panel-kicker {
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.2;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .panel-tools {
      display: grid;
      justify-items: end;
      gap: 0.4rem;
    }

    .group-controls {
      display: inline-grid;
      grid-template-columns: repeat(3, 2.6rem);
      gap: 0.24rem;
      padding: 0.16rem;
      border: 0.1rem solid rgba(255, 255, 255, 0.12);
      border-radius: 0.35rem;
      background: rgba(0, 0, 0, 0.18);
    }

    .group-button {
      min-width: 0;
      height: 1.55rem;
      border: 0;
      border-radius: 0.24rem;
      background: transparent;
      color: rgba(248, 251, 255, 0.64);
      font: inherit;
      font-size: 0.66rem;
      font-weight: 900;
      letter-spacing: 0;
      cursor: pointer;
    }

    .group-button:hover,
    .group-button:focus-visible {
      color: var(--ink);
      outline: 0;
      background: rgba(255, 255, 255, 0.12);
    }

    .group-button.active {
      color: #07121a;
      background: var(--gold);
      box-shadow: 0 0 1rem rgba(255, 209, 102, 0.28);
    }

    .standings-scroll {
      flex: 1;
      min-height: 0;
      margin-top: 0.9rem;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 0.4rem;
      scrollbar-color: rgba(255, 209, 102, 0.9) rgba(255, 255, 255, 0.10);
      scrollbar-width: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    .standings-scroll:not(:has(.standings-overlay:not(.hidden))) {
      overflow-y: auto;
      padding-right: 0;
      scrollbar-width: none;
    }

    .standings-scroll:not(:has(.standings-overlay:not(.hidden)))::-webkit-scrollbar {
      display: none;
    }

    #standingsView {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .standings-groups {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0.45rem;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .standings-groups::-webkit-scrollbar {
      display: none;
    }

    #standingsView .group-card {
      margin-bottom: 0;
    }

    #standingsView .player-stats-entry {
      flex-shrink: 0;
      margin-top: auto;
    }

    #playerStatsView {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    #playerStatsView.hidden {
      display: none;
    }

    .standings-scroll::-webkit-scrollbar,
    .fixtures-list::-webkit-scrollbar {
      width: 0.55rem;
    }

    .standings-scroll::-webkit-scrollbar-thumb,
    .fixtures-list::-webkit-scrollbar-thumb {
      background: rgba(255, 209, 102, 0.85);
      border-radius: 999rem;
      min-height: 2.5rem;
    }

    .standings-scroll::-webkit-scrollbar-track,
    .fixtures-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999rem;
    }

    .group-card {
      margin-bottom: 0.65rem;
      padding: 0.7rem 0.75rem;
      border: 0.1rem solid rgba(255, 255, 255, 0.12);
      border-radius: 0.4rem;
      background: var(--glass-card);
      animation: groupFade 420ms ease-out both;
    }

    .group-card:last-child {
      margin-bottom: 0;
    }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .group-name {
      font-size: 0.82rem;
      font-weight: 900;
      color: var(--gold);
      text-transform: uppercase;
    }

    .group-status {
      color: #c8d8ec;
      text-shadow: var(--read-shadow);
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .table-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 1.2rem 1.2rem 1.2rem 1.5rem 1.7rem;
      align-items: center;
      gap: 0.3rem;
      min-height: 1.62rem;
      color: rgba(248, 251, 255, 0.9);
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
      border-top: 0.1rem solid rgba(255, 255, 255, 0.07);
    }

    .table-row.header {
      min-height: 1.25rem;
      color: var(--dim);
      font-size: 0.58rem;
      font-weight: 900;
      text-transform: uppercase;
      border-top: 0;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 0;
      font-weight: 800;
    }

    .team-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flag-img {
      flex: 0 0 auto;
      width: 1.48rem;
      height: 0.98rem;
      border-radius: 0.08rem;
      background-image: var(--flag);
      background-position: center;
      background-size: cover;
      box-shadow:
        0 0.14rem 0.24rem rgba(0, 0, 0, 0.34),
        0 0 0 0.05rem rgba(255, 255, 255, 0.34);
    }

    .num {
      text-align: right;
    }

    .center-stage {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 1.15rem;
      min-width: 0;
      text-align: center;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--gold);
      text-shadow: var(--read-shadow);
      font-size: 0.86rem;
      line-height: 1.4;
      text-transform: uppercase;
      font-weight: 850;
      letter-spacing: 0;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 3.4rem;
      height: 0.12rem;
      border-radius: 999rem;
      background: linear-gradient(90deg, transparent, currentColor);
      opacity: 0.72;
    }

    .eyebrow::after {
      background: linear-gradient(90deg, currentColor, transparent);
    }

    h1 {
      margin: 0;
      max-width: 48rem;
      font-size: 4rem;
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: 0;
      color: #fff8e8;
      text-shadow: var(--read-shadow), 0 0 2rem rgba(255, 209, 102, 0.22);
    }

    .trophy-mark {
      position: relative;
      width: 5.3rem;
      height: 9rem;
      margin: -0.45rem 0 -0.65rem;
      filter:
        drop-shadow(0 0.55rem 0.85rem rgba(0, 0, 0, 0.34))
        drop-shadow(0 0 1.4rem rgba(255, 209, 102, 0.28));
    }

    .trophy-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .matchup {
      display: grid;
      grid-template-columns: 8rem minmax(20rem, 39rem) 8rem;
      align-items: center;
      gap: 1rem;
      width: min(58rem, 100%);
    }

    .team-flag-card {
      display: grid;
      align-content: center;
      justify-items: center;
      min-height: 8.4rem;
      border-block: 0.1rem solid rgba(255, 255, 255, 0.16);
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.1), transparent 60%),
        rgba(7, 24, 34, 0.42);
      box-shadow: inset 0 0 1.5rem rgba(255, 255, 255, 0.04);
    }

    .big-flag-img {
      width: 5.2rem;
      aspect-ratio: 4 / 3;
      border-radius: 0.18rem;
      background-image: var(--flag);
      background-position: center;
      background-size: cover;
      box-shadow:
        0 0.45rem 0.8rem rgba(0, 0, 0, 0.36),
        0 0 0 0.07rem rgba(255, 255, 255, 0.24),
        0 0 1.6rem rgba(255, 255, 255, 0.12);
    }

    .side-team {
      width: 100%;
      margin-top: 0.55rem;
      padding: 0 0.45rem;
      color: #ffffff;
      text-shadow: var(--read-shadow);
      font-size: 0.78rem;
      line-height: 1.2;
      font-weight: 850;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .match-meta {
      display: grid;
      gap: 0.35rem;
      min-width: 0;
    }

    .versus {
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-shadow: var(--read-shadow);
    }

    .fixture-title {
      margin: 0;
      overflow: hidden;
      color: #fffdf5;
      font-size: 1.34rem;
      line-height: 1.25;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: var(--read-shadow);
    }

    .fixture-subtitle {
      margin: 0;
      overflow: hidden;
      color: #e8f4ff;
      font-size: 0.92rem;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: var(--read-shadow);
    }

    .timer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: stretch;
      justify-content: center;
      gap: 0.75rem;
      width: min(45rem, 100%);
      padding: 0.4rem 0;
    }

    .time-unit {
      position: relative;
      min-width: 0;
      display: grid;
      align-content: center;
      justify-items: center;
      min-height: 9rem;
      border-block: 0.1rem solid rgba(255, 255, 255, 0.16);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.03)),
        rgba(7, 24, 34, 0.45);
      box-shadow: inset 0 0 2rem rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .time-unit::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 0 28%, rgba(255, 255, 255, 0.18) 36%, transparent 46% 100%);
      transform: translateX(-120%);
      animation: shine 5.8s ease-in-out infinite;
    }

    .digits {
      position: relative;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      font-size: 5.3rem;
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: 0;
      color: var(--gold);
      text-shadow: var(--read-shadow);
    }

    .label {
      position: relative;
      margin-top: 0.62rem;
      color: #ffffff;
      text-shadow: var(--read-shadow);
      font-size: 0.76rem;
      line-height: 1.3;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .colon {
      align-self: center;
      color: var(--gold);
      font-size: 4.7rem;
      line-height: 1;
      font-weight: 900;
      text-shadow: var(--read-shadow);
      animation: blink 1s steps(2, jump-none) infinite;
    }

    .stage-display {
      width: min(45rem, 100%);
    }

    .stage-display .hidden {
      display: none;
    }

    .center-stage.is-live h1 {
      color: #fff5d6;
    }

    .live-board {
      display: grid;
      gap: 0.55rem;
      justify-items: center;
      padding: 0.2rem 0 0.4rem;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.32rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 77, 95, 0.22);
      border: 0.1rem solid rgba(255, 120, 130, 0.55);
      color: #ffe8eb;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: var(--read-shadow);
      animation: livePulse 1.6s ease-in-out infinite;
    }

    .live-badge::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: #ff4d5f;
      box-shadow: 0 0 0.8rem rgba(255, 77, 95, 0.9);
      animation: blink 1s steps(2, jump-none) infinite;
    }

    .live-score-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: stretch;
      gap: 0.75rem;
      width: 100%;
    }

    .live-score-unit .digits {
      font-size: 6.2rem;
    }

    .live-sep {
      font-size: 4.2rem;
      animation: none;
      opacity: 0.82;
    }

    .live-minute {
      font-size: 1.35rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-shadow: var(--read-shadow);
    }

    @keyframes livePulse {
      0%, 100% { box-shadow: 0 0 0 rgba(255, 77, 95, 0); }
      50% { box-shadow: 0 0 1.4rem rgba(255, 77, 95, 0.35); }
    }

    .match-card.is-live {
      border-color: rgba(255, 120, 130, 0.42);
      box-shadow: inset 0 0 1.2rem rgba(255, 77, 95, 0.12);
    }

    .live-timeline {
      width: min(45rem, 100%);
      margin-top: 0.5rem;
      padding: 0.65rem 0.75rem;
      border: 0.1rem solid rgba(255, 255, 255, 0.14);
      border-radius: 0.4rem;
      background: rgba(4, 18, 24, 0.42);
    }

    .live-timeline-head {
      margin-bottom: 0.5rem;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: var(--read-shadow);
    }

    .live-timeline-list {
      display: grid;
      gap: 0.32rem;
      max-height: 10rem;
      overflow-y: auto;
      padding-right: 0.25rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 209, 102, 0.9) rgba(255, 255, 255, 0.10);
    }

    .match-event-section {
      margin-bottom: 0.65rem;
    }

    .match-event-head {
      margin-bottom: 0.45rem;
      font-size: 0.66rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .match-event-feed {
      display: grid;
      gap: 0.42rem;
    }

    .match-event-goals-board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0.55rem;
      padding: 0.45rem 0.5rem;
      border-radius: 0.35rem;
      background: rgba(255, 255, 255, 0.06);
    }

    .match-event-goals-col {
      display: grid;
      gap: 0.38rem;
      color: #ffffff;
      font-size: 0.66rem;
      font-weight: 700;
      line-height: 1.3;
      min-width: 0;
    }

    .match-event-goals-col.is-home {
      text-align: left;
      padding-right: 0.35rem;
      border-right: 0.06rem solid rgba(255, 255, 255, 0.12);
    }

    .match-event-goals-col.is-away {
      text-align: right;
      padding-left: 0.35rem;
    }

    .match-event-goal-row {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr);
      align-items: start;
      gap: 0.28rem;
      min-width: 0;
    }

    .match-event-goals-col.is-away .match-event-goal-row {
      grid-template-columns: minmax(0, 1fr) auto auto;
    }

    .match-event-goals-col.is-away .match-event-goal-minute {
      order: 3;
    }

      gap: 0.35rem;
      padding: 0.42rem 0.45rem;
      border-bottom: 0.08rem solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 0.64rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .lineup-bench-col-head .flag-img {
      width: 1.05rem;
      height: 0.7rem;
      flex-shrink: 0;

    .lineup-bench-col.is-home .lineup-bench-col-head {
      background: var(--home-kit-bg);
      color: var(--home-kit-text);
    }

    .lineup-bench-col.is-away .lineup-bench-col-head {
      background: var(--away-kit-bg);
      color: var(--away-kit-text);
    }

    .lineup-bench-col.is-home .lineup-bench-photo {
      border-color: var(--home-kit-border);
      background: var(--home-kit-bg);
    }

    .lineup-bench-col.is-away .lineup-bench-photo {
      border-color: var(--away-kit-border);
      background: var(--away-kit-bg);
    }

    .lineup-bench-col.is-home .lineup-player-photo-fallback {
      color: var(--home-kit-text);
    }

    .lineup-bench-col.is-away .lineup-player-photo-fallback {
      color: var(--away-kit-text);
    }

    .lineup-bench-col + .lineup-bench-col {
      border-left: 0.08rem solid rgba(255, 255, 255, 0.1);
    }

    .lineup-bench-row {
      display: grid;
      grid-template-columns: 1.7rem minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.35rem;
      padding: 0.42rem 0.45rem;
      border-top: 0.06rem solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 0.66rem;
      font-weight: 700;
    }

    .lineup-bench-photo {
      width: 1.55rem;
      height: 1.55rem;
      border-radius: 50%;
      border: 0.06rem solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .lineup-bench-row:first-child {
      border-top: 0;
    }

    .lineup-bench-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .lineup-bench-main {
      min-width: 0;
    }

    .lineup-bench-name {
      font-weight: 800;
      overflow: visible;
      white-space: normal;
      word-break: break-word;
      line-height: 1.25;
    }

    .lineup-bench-col.is-home .lineup-bench-name,
    .lineup-bench-col.is-home .lineup-bench-pos {
      color: #f8fbff;
    }

    .lineup-bench-col.is-away .lineup-bench-name,
    .lineup-bench-col.is-away .lineup-bench-pos {
      color: #f8fbff;
    }

    .lineup-bench-pos {
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.58rem;
      font-weight: 700;
    }

    .lineup-bench-events {
      display: flex;
      align-items: center;
      gap: 0.18rem;
      flex-shrink: 0;
    }

    .lineup-bench-minute {
      color: #ffffff;
      font-size: 0.58rem;
      font-weight: 900;
    }

    .fixtures-list {
      display: grid;
      gap: 0.75rem;
      max-height: 34rem;
      margin-top: 0.9rem;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 0.35rem;
      scrollbar-color: rgba(255, 209, 102, 0.9) rgba(255, 255, 255, 0.10);
      scrollbar-width: thin;
    }

    .match-card {
      display: grid;
      gap: 0.52rem;
      padding: 0.85rem;
      border: 0.1rem solid rgba(255, 255, 255, 0.12);
      border-radius: 0.4rem;
      background: var(--glass-card);
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .match-card:hover {
      border-color: rgba(255, 209, 102, 0.35);
    }

    .match-card.is-selected {
      border-color: rgba(255, 209, 102, 0.58);
      box-shadow: inset 0 0 1rem rgba(255, 209, 102, 0.14);
    }

    .match-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }

    .match-team {
      display: flex;
      align-items: center;
      gap: 0.36rem;
      min-width: 0;
      font-size: 0.82rem;
      font-weight: 900;
    }

    .match-team.away {
      justify-content: end;
    }

    .match-team-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .match-v {
      color: var(--gold);
      font-size: 0.74rem;
      font-weight: 900;
      text-shadow: var(--read-shadow);
    }

    .num.pts,
    .table-row .num:last-child {
      color: var(--gold);
      font-weight: 900;
    }

    .table-row .num.is-provisional {
      color: #ffe08a;
    }

    .match-time {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      color: #dce8f8;
      font-size: 0.72rem;
      line-height: 1.35;
      font-weight: 800;
    }

    .match-time span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .local-clock-wrap {
      position: fixed;
      right: calc(2rem + var(--taskbar-inset-right, 0px));
      bottom: calc(1.2rem + var(--taskbar-inset, 0px) + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      display: grid;
      justify-items: end;
      gap: 0.18rem;
      text-align: right;
      pointer-events: none;
    }

    .local-clock {
      color: #e8f4ff;
      font-size: 0.78rem;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--read-shadow);
    }

    .local-updated {
      color: rgba(200, 216, 236, 0.88);
      font-size: 0.62rem;
      line-height: 1.35;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--read-shadow);
    }

    .empty-state {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
      font-weight: 800;
    }

    @media (max-height: 1080px) {
      .standings-panel {
        height: min(50rem, calc(100vh - 5rem));
      }

      #standingsView .group-card {
        padding: 0.58rem 0.65rem;
      }

      #standingsView .table-row {
        min-height: 1.48rem;
        font-size: 0.72rem;
      }

      #standingsView .table-row.header {
        min-height: 1.15rem;
      }
    }

    @media (max-width: 1280px) {
      .dashboard {
        grid-template-columns: 21rem minmax(30rem, 1fr) 21rem;
        gap: 1rem;
        padding-inline: 1rem;
      }

      h1 {
        font-size: 3.1rem;
      }

      .matchup {
        grid-template-columns: 6.5rem minmax(18rem, 1fr) 6.5rem;
      }

      .digits {
        font-size: 4.2rem;
      }

      .time-unit {
        min-height: 7.6rem;
      }
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .wallpaper {
        min-height: 1180px;
      }

      .dashboard {
        grid-template-columns: 1fr;
        align-items: start;
        height: auto;
        min-height: 100%;
        padding: 1rem 1rem 4rem;
      }

      .center-stage {
        order: -1;
        min-height: 36rem;
      }

      .standings-panel,
      .fixtures-panel {
        min-height: auto;
        height: auto;
      }

      .standings-scroll {
        flex: 1;
        min-height: 0;
        height: auto;
        max-height: none;
      }

      .standings-scroll:has(.standings-overlay:not(.hidden)) {
        max-height: 34rem;
      }

      .fixtures-list {
        height: 34rem;
        max-height: 34rem;
      }
    }

    @media (max-width: 680px) {
      .wallpaper {
        min-height: 1120px;
      }

      .center-stage {
        gap: 0.8rem;
      }

      h1 {
        font-size: 2.35rem;
      }

      .eyebrow {
        font-size: 0.72rem;
      }

      .matchup {
        grid-template-columns: 1fr 1.7fr 1fr;
        gap: 0.45rem;
      }

      .team-flag-card {
        min-height: 6.8rem;
      }

      .big-flag-img {
        width: 4rem;
      }

      .side-team {
        font-size: 0.68rem;
      }

      .fixture-title {
        font-size: 1rem;
      }

      .fixture-subtitle {
        font-size: 0.74rem;
      }

      .timer {
        gap: 0.38rem;
      }

      .digits {
        font-size: 2.95rem;
      }

      .colon {
        font-size: 2.8rem;
      }

      .time-unit {
        min-height: 6.2rem;
      }

      .label {
        font-size: 0.62rem;
      }

      .live-score-unit .digits {
        font-size: 3.4rem;
      }

      .live-minute {
        font-size: 1rem;
      }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    @keyframes pitchDrift {
      from {
        transform: scale(1.02) translateY(0);
      }

      to {
        transform: scale(1.04) translateY(0.7rem);
      }
    }

    @keyframes sweep {
      0%,
      100% {
        opacity: 0.28;
      }

      45% {
        opacity: 0.58;
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.48;
        transform: translate(-50%, -50%) scale(0.98);
      }

      50% {
        opacity: 0.82;
        transform: translate(-50%, -50%) scale(1.03);
      }
    }

    @keyframes floatRibbon {
      0%,
      100% {
        translate: 0 0;
      }

      50% {
        translate: 0 -1.1rem;
      }
    }

    @keyframes shine {
      0%,
      55% {
        transform: translateX(-120%);
      }

      85%,
      100% {
        transform: translateX(120%);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0.38;
      }
    }

    @keyframes groupFade {
      from {
        opacity: 0;
        transform: translateY(0.45rem);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

  <main class="wallpaper" aria-label="World Cup countdown wallpaper">
    <div class="bg-poster" aria-hidden="true">

    <section class="dashboard">

          </div>
        </div>
        <div class="standings-scroll" id="standingsScroll">
          <div id="standingsView"></div>
          <div id="playerStatsView" class="standings-overlay hidden"></div>
          <div id="groupHistoryView" class="standings-overlay hidden"></div>
          <div id="matchDetailView" class="standings-overlay hidden"></div>
        </div>
      </aside>

      <section class="center-stage" id="centerStage" aria-label="Trận đấu tiếp theo">
        <div class="eyebrow">FIFA WORLD CUP 2026</div>
        <h1>Trận đấu tiếp theo</h1>
        <div class="trophy-mark" aria-label="Cúp Vàng FIFA">
          <img class="trophy-image" src="assets/world-cup-trophy.png" alt="Cúp Vàng FIFA">
        </div>

        <div class="matchup">
          <div class="team-flag-card">
            <div class="big-flag-img" id="homeFlag" style="--flag: url('flags/mx.png')" aria-hidden="true"></div>
            <div class="side-team" id="homeName">Mexico</div>
          </div>

          <div class="match-meta">
            <div class="versus" id="matchGroup">Bảng A</div>
            <p class="fixture-title" id="matchTitle">Mexico vs South Africa</p>
            <p class="fixture-subtitle" id="matchTime">Giờ VN 12/06 02:00 · Mexico City Stadium</p>
          </div>

          <div class="team-flag-card">
            <div class="big-flag-img" id="awayFlag" style="--flag: url('flags/za.png')" aria-hidden="true"></div>
            <div class="side-team" id="awayName">South Africa</div>
          </div>
        </div>

        <div class="stage-display" id="stageDisplay">
          <div class="timer" id="countdownTimer" aria-live="polite">
            <div class="time-unit">
              <div class="digits" id="hours">00</div>
              <div class="label">GIỜ</div>
            </div>
            <div class="colon">:</div>
            <div class="time-unit">
              <div class="digits" id="minutes">00</div>
              <div class="label">PHÚT</div>
            </div>
            <div class="colon">:</div>
            <div class="time-unit">
              <div class="digits" id="seconds">00</div>
              <div class="label">GIÂY</div>
            </div>
          </div>

          <div class="live-board hidden" id="liveBoard" aria-live="polite">
            <div class="live-badge">Trực tiếp</div>
            <div class="live-score-row">
              <div class="time-unit live-score-unit">
                <div class="digits" id="liveHomeScore">0</div>
                <div class="label" id="liveHomeShort">---</div>
              </div>
              <div class="colon live-sep">-</div>
              <div class="time-unit live-score-unit">
                <div class="digits" id="liveAwayScore">0</div>
                <div class="label" id="liveAwayShort">---</div>
              </div>
            </div>
            <div class="live-minute" id="liveMinute">Đang đá</div>
          </div>

          <div class="live-timeline hidden" id="liveTimeline">
            <div class="live-timeline-head">Sự kiện trận đấu</div>
            <div class="live-timeline-list" id="liveTimelineList"></div>
          </div>
        </div>
      </section>

      <aside class="panel fixtures-panel" aria-label="5 trận tiếp theo">
        <div class="panel-head">
          <h2 class="panel-title">5 trận tiếp theo</h2>
          <div class="panel-kicker" id="dataStatus">CỤC BỘ</div>
        </div>
        <div class="fixtures-list" id="fixtures"></div>
      </aside>
    </section>

    <div class="local-clock-wrap">
      <div class="local-clock" id="localClock">Giờ VN · —</div>
      <div class="local-updated" id="localUpdated">Deploy web: —</div>
    </div>

    function pad(value, size) {
      return String(value).padStart(size, "0");
    }

    function team(name) {
      const info = teamInfo[name] || { code: "", short: name.slice(0, 3).toUpperCase() };
      return {
        ...info,
        kit: teamKitColors[name] || defaultTeamKit
      };
    }

    function hexToRgb(hex) {
      const raw = String(hex || "").replace("#", "");
      if (raw.length !== 6) {
        return [0, 0, 0];
      }

      return [
        Number.parseInt(raw.slice(0, 2), 16),
        Number.parseInt(raw.slice(2, 4), 16),
        Number.parseInt(raw.slice(4, 6), 16)
      ];
    }

    function kitColorDistance(left, right) {
      const [r1, g1, b1] = hexToRgb(left);
      const [r2, g2, b2] = hexToRgb(right);
      return Math.sqrt((r1 - r2) ** 2 + (g1 - g2) ** 2 + (b1 - b2) ** 2);
    }

    function resolveTeamKit(teamName, opponentName, isHome) {
      const kits = team(teamName).kit;
      const homeKit = kits.home || defaultTeamKit.home;
      const awayKit = kits.away || defaultTeamKit.away;

      if (isHome) {
        return homeKit;
      }

      const opponentHomeKit = team(opponentName).kit.home || defaultTeamKit.home;
      if (kitColorDistance(homeKit.bg, opponentHomeKit.bg) < 110) {
        return awayKit;
      }

      return homeKit;
    }

    function lineupKitStyleVars(homeTeam, awayTeam) {
      const homeKit = resolveTeamKit(homeTeam, awayTeam, true);
      let awayKit = resolveTeamKit(awayTeam, homeTeam, false);

      if (kitColorDistance(homeKit.bg, awayKit.bg) < 110) {
        awayKit = team(awayTeam).kit.away || defaultTeamKit.away;
      }

      if (kitColorDistance(homeKit.bg, awayKit.bg) < 110) {
        awayKit = {
          ...awayKit,
          bg: awayKit.border !== homeKit.bg ? awayKit.border : defaultTeamKit.away.bg,
          text: awayKit.text,
          border: awayKit.border
        };
      }

      return [
        `--home-kit-bg:${homeKit.bg}`,
        `--home-kit-text:${homeKit.text}`,
        `--home-kit-border:${homeKit.border}`,
        `--away-kit-bg:${awayKit.bg}`,
        `--away-kit-text:${awayKit.text}`,
        `--away-kit-border:${awayKit.border}`
      ].join(";");
    }

    function flagPath(teamName) {
      const data = team(teamName);
      return data.code ? `flags/${data.code}.png` : "";
    }

    function flagStyle(teamName) {
      const path = flagPath(teamName);
      return path ? `--flag: url('${path}')` : "";
    }

      const parts = new Intl.DateTimeFormat("vi-VN", {
        timeZone: TIMEZONE_VN,
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false

      const pick = (type) => parts.find((part) => part.type === type)?.value ?? "00";
      return `${pick("day")}/${pick("month")} ${pick("hour")}:${pick("minute")}`;

        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
    }

    function renderLocalClock() {
      if (localClockEl) {
        localClockEl.textContent = `Giờ VN · ${formatVnDateTime(new Date())}`;
      }

      if (!localUpdatedEl) {
        return;
      }

      const deployAt = window.WC26_DEPLOY?.updatedAt;
      if (deployAt) {
        localUpdatedEl.textContent = `Deploy web: ${formatVnDateTime(new Date(deployAt))}`;
        return;
      }

      localUpdatedEl.textContent = "Deploy web: —";
    }

    function readTaskbarInsetOverride() {
      const params = new URLSearchParams(window.location.search);
      const queryValue = Number(params.get("taskbar"));
      if (Number.isFinite(queryValue) && queryValue >= 0) {
        return queryValue;
      }

      const storedValue = Number(window.localStorage.getItem("wc26TaskbarInset"));
      if (Number.isFinite(storedValue) && storedValue >= 0) {
        return storedValue;
      }

      return null;
    }

    function syncTaskbarInset() {
      const override = readTaskbarInsetOverride();
      const screenBottom = Math.max(0, window.screen.height - window.screen.availHeight);
      const screenRight = Math.max(0, window.screen.width - window.screen.availWidth);
      const viewport = window.visualViewport;
      const viewportBottom = viewport
        ? Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop)
        : 0;
      const viewportRight = viewport
        ? Math.max(0, window.innerWidth - viewport.width - viewport.offsetLeft)
        : 0;
      const bottomInset = override ?? Math.max(screenBottom, viewportBottom);
      const rightInset = Math.max(screenRight, viewportRight);

      document.documentElement.style.setProperty("--taskbar-inset", `${bottomInset}px`);
      document.documentElement.style.setProperty("--taskbar-inset-right", `${rightInset}px`);
    }

    function startTaskbarInsetWatcher() {
      syncTaskbarInset();
      window.addEventListener("resize", syncTaskbarInset);
      window.addEventListener("orientationchange", syncTaskbarInset);
      window.visualViewport?.addEventListener("resize", syncTaskbarInset);
      window.visualViewport?.addEventListener("scroll", syncTaskbarInset);
      window.setInterval(syncTaskbarInset, 1500);
    }

    function applySpoilerDelay(match) {
      const key = matchKey(match.home, match.away, match.utc);
      const rawHome = match.homeScore;
      const rawAway = match.awayScore;
      const hasScore = rawHome !== null && rawAway !== null;
      const rawInProgress = match.inProgress;
      const rawCompleted = match.completed;

      const withRaw = (patch) => ({
        ...match,
        rawHomeScore: rawHome,
        rawAwayScore: rawAway,
        rawInProgress,
        rawCompleted,
        ...patch
      });

      if ((!rawInProgress && !rawCompleted) || !hasScore) {
        return withRaw({ isProvisional: false });
      }

      let state = scoreDelayState.get(key);
      if (!state) {
        state = {
          shownHome: null,
          shownAway: null,
          targetHome: null,
          targetAway: null,
          targetSince: 0,
          wasLive: false,
          liveBootstrapped: false,
          latestSummary: null,
          shownSummary: null
        };
        scoreDelayState.set(key, state);
      }

      // Trận đã kết thúc trước phiên hiện tại → hiện ngay (lịch sử / bảng điểm)
      if (rawCompleted && !rawInProgress && !state.wasLive) {
        state.shownHome = rawHome;
        state.shownAway = rawAway;
        state.targetHome = rawHome;
        state.targetAway = rawAway;
        return withRaw({
          homeScore: rawHome,
          awayScore: rawAway,
          completed: true,
          inProgress: false,
          statusState: "post",
          isProvisional: false
        });
      }

      const now = Date.now();

      if (rawInProgress) {
        state.wasLive = true;

        // Lần đầu thấy trận live → hiện tỷ số ESPN ngay, chỉ delay khi có bàn mới sau đó
        if (!state.liveBootstrapped) {
          state.liveBootstrapped = true;
          state.shownHome = rawHome;
          state.shownAway = rawAway;
          state.targetHome = rawHome;
          state.targetAway = rawAway;
          state.targetSince = now;
          commitSummaryOnScoreReveal(state);
        }
      }

      if (state.targetHome !== rawHome || state.targetAway !== rawAway) {
        state.targetHome = rawHome;
        state.targetAway = rawAway;
        state.targetSince = now;
      }

      const delayElapsed = now - state.targetSince >= SPOILER_DELAY_MS;
      const shownDiffers = state.shownHome !== state.targetHome || state.shownAway !== state.targetAway;

      if (shownDiffers && delayElapsed) {
        state.shownHome = state.targetHome;
        state.shownAway = state.targetAway;
        commitSummaryOnScoreReveal(state);
      }

      if (state.shownHome === null || state.shownAway === null) {
        return withRaw({
          homeScore: null,
          awayScore: null,
          completed: rawCompleted,
          inProgress: rawInProgress,
          statusState: rawInProgress ? "in" : rawCompleted ? "post" : "pre",
          isProvisional: false
        });
      }

      const isProvisional = rawInProgress && shownDiffers;

      return withRaw({
        homeScore: state.shownHome,
        awayScore: state.shownAway,
        completed: rawCompleted,
        inProgress: rawInProgress,
        statusState: rawInProgress ? "in" : rawCompleted ? "post" : match.statusState,
        isProvisional
      });
    }

    function commitSummaryOnScoreReveal(state) {
      if (state?.latestSummary) {
        state.shownSummary = state.latestSummary;
      }
    }

    function createEmptyMatchSummary() {
      return {
        events: [],
        stats: null,
        statsData: null,
        lineups: null
      };
    }

    function needsSpoilerDelay(match, state) {
      const rawInProgress = match.rawInProgress ?? match.inProgress;
      const rawCompleted = match.rawCompleted ?? match.completed;

      if (!rawInProgress && !rawCompleted) {
        return false;
      }

      if (rawCompleted && !rawInProgress && state && !state.wasLive) {
        return false;
      }

      return true;
    }

    function withLatestLineups(summary, freshSummary) {
      if (!freshSummary?.lineups) {
        return summary;
      }

      return {
        ...summary,
        lineups: freshSummary.lineups
      };
    }

    function resolveDisplayedSummary(match, freshSummary) {
      if (!freshSummary) {
        return null;
      }

      const key = matchKey(match.home, match.away, match.utc);
      const state = scoreDelayState.get(key);

      if (!needsSpoilerDelay(match, state)) {
        return freshSummary;
      }

      if (!state) {
        return withLatestLineups(createEmptyMatchSummary(), freshSummary);
      }

      state.latestSummary = freshSummary;

      if (state.shownHome === null || state.shownAway === null) {
        return withLatestLineups(state.shownSummary || createEmptyMatchSummary(), freshSummary);
      }

      const pendingScoreChange = state.targetHome !== state.shownHome || state.targetAway !== state.shownAway;

      if (!pendingScoreChange) {
        state.shownSummary = freshSummary;
        return freshSummary;
      }

      return withLatestLineups(state.shownSummary || createEmptyMatchSummary(), freshSummary);
    }

    async function fetchDisplayMatchSummary(match) {
      const fresh = await fetchMatchSummary(match.espnId);
      if (!fresh) {
        return null;
      }

      return resolveDisplayedSummary(match, fresh);
    }

    function refreshLiveViews(options = {}) {
      const { skipCountdown = false } = options;

      if (standingsOverlay === "standings") {
        renderStandings();
      } else if (standingsOverlay === "players") {
        renderPlayerStatsView();
      } else if (standingsOverlay === "history" && selectedGroupName) {
        renderGroupHistory(selectedGroupName);
      } else if (standingsOverlay === "detail" && selectedMatchKey) {
        refreshMatchDetailPanel();
      }

      if (!skipCountdown) {
        updateCountdown();
      }
    }

    function refreshMatchDetailScore() {
      const match = getMatchByKey(selectedMatchKey);
      const scoreEl = matchDetailViewEl?.querySelector(".match-detail-score");
      const metaEl = matchDetailViewEl?.querySelector(".match-detail-meta");

      if (!match || !scoreEl) {
        return;
      }

      scoreEl.innerHTML = renderMatchScoreRow(match.home, match.away, scoreText(match));

      if (metaEl) {
        const live = match.inProgress || match.rawInProgress;
        metaEl.textContent = live
          ? `${liveMinuteText(match)} · LIVE · ${match.venue}`
          : `Giờ VN ${formatVietnamTime(match.utc)} · ${match.venue}`;

    }

    async function refreshMatchDetailPanel() {
      const match = getMatchByKey(selectedMatchKey);
      if (!match || standingsOverlay !== "detail") {
        return;
      }

      refreshMatchDetailScore();

      const summary = await fetchDisplayMatchSummary(match);
      if (selectedMatchKey !== matchKey(match.home, match.away, match.utc)) {
        return;
      }

      currentDetailSummary = summary;
      renderDetailTabPanel(summary, match, detailTab);
    }

    function liveEventDayKey(home, away, utc) {
      const teams = [canonicalName(home), canonicalName(away)].sort().join("|");
      const day = new Date(utc).toISOString().slice(0, 10);
      return `${teams}|${day}`;
    }

    function buildLiveLookups(liveEvents) {
      const byExact = new Map();
      const byDay = new Map();

      liveEvents.forEach((event) => {
        if (!event.home || !event.away || !event.utc) {
          return;
        }

        const exactKey = matchKey(event.home, event.away, event.utc);
        byExact.set(exactKey, event);

        const dayKey = liveEventDayKey(event.home, event.away, event.utc);
        const existing = byDay.get(dayKey);
        if (!existing) {
          byDay.set(dayKey, event);
          return;
        }

        const preferLive = event.statusState === "in" && existing.statusState !== "in";
        const newerKickoff = Date.parse(event.utc) > Date.parse(existing.utc);
        if (preferLive || newerKickoff) {
          byDay.set(dayKey, event);
        }
      });

      return { byExact, byDay };
    }

    function lookupLiveEvent(scheduleMatch, lookups) {
      const exactKey = matchKey(scheduleMatch.home, scheduleMatch.away, scheduleMatch.utc);
      const exact = lookups.byExact.get(exactKey);
      if (exact) {
        return exact;
      }

      const dayKey = liveEventDayKey(scheduleMatch.home, scheduleMatch.away, scheduleMatch.utc);
      return lookups.byDay.get(dayKey) || null;
    }

    function mergeRawSchedule() {
      const liveEvents = liveData && Array.isArray(liveData.events) ? liveData.events : [];
      const lookups = buildLiveLookups(liveEvents);

      return schedule.map((match) => {
        const event = lookupLiveEvent(match, lookups);
        if (!event) {
          return {
            ...match,
            completed: false,
            inProgress: false,
            statusState: "pre",
            statusText: "Đã lên lịch",
            homeScore: null,
            awayScore: null,
            espnId: ""
          };
        }

        const staticHome = canonicalName(match.home);
        const liveHome = canonicalName(event.home);
        const homeScore = liveHome === staticHome ? event.homeScore : event.awayScore;
        const awayScore = liveHome === staticHome ? event.awayScore : event.homeScore;
        const statusState = event.statusState || "pre";

        return {
          ...match,
          utc: event.utc || match.utc,
          venue: event.venue || match.venue,
          espnId: String(event.id || ""),
          completed: Boolean(event.completed),
          inProgress: statusState === "in",
          statusState,
          statusText: event.statusText || event.statusDetail || "Đã lên lịch",
          statusDetail: event.statusDetail || "",
          displayClock: event.displayClock || event.statusDetail || "",
          statusClock: Number(event.statusClock) || 0,
          statusPeriod: Number(event.statusPeriod) || 1,
          statusClockUpdatedAt: Number(event.statusClockUpdatedAt) || Date.now(),
          homeScore: numberScore(homeScore),
          awayScore: numberScore(awayScore)
        };
      });
    }

    function mergeLiveSchedule() {
      return mergeRawSchedule().map(applySpoilerDelay);
    }

    function scoreText(match) {
      if (match.homeScore === null || match.awayScore === null) {
        return "vs";
      }

      return `${match.homeScore}-${match.awayScore}`;
    }

    function statusText(match) {
      if (isLiveMatch(match)) {
        return liveMinuteText(match);
      }

      if (match.completed) {
        return "Kết thúc";
      }

      return formatVietnamTime(match.utc);
    }

    function liveMinuteText(match) {
      if (isLiveMatch(match)) {
        const ticking = formatLiveClock(match);
        if (ticking) {
          return ticking;
        }
      }

      const detail = String(match.statusDetail || "").trim();
      const display = String(match.displayClock || "").trim();
      const text = String(match.statusText || "").trim();
      const generic = new Set(["In Progress", "Đã lên lịch", "Scheduled", "TRỰC TIẾP"]);

      if (display && (/\d/.test(display) || display.includes("'"))) {
        return display;
      }

      if (detail && (/\d/.test(detail) || detail.includes("'"))) {
        return detail;
      }

      if (text && !generic.has(text)) {
        return text;
      }

      return "Đang đá";
    }

    function getLiveClockSeconds(match) {
      if (!isLiveMatch(match)) {
        return null;
      }

      const base = Number(match.statusClock);
      if (!Number.isFinite(base) || base < 0) {
        return null;
      }

      const fetchedAt = Number(match.statusClockUpdatedAt) || Date.now();
      const drift = Math.max(0, Math.floor((Date.now() - fetchedAt) / 1000));
      return base + drift;
    }

    function formatLiveClock(match) {
      const seconds = getLiveClockSeconds(match);
      if (seconds === null) {
        return "";
      }

      const period = Number(match.statusPeriod) || 1;
      const minute = Math.floor(seconds / 60);

      if (period <= 1) {
        if (minute < 45) {
          return `${minute}'`;
        }

        const extra = minute - 45;
        return extra > 0 ? `45+${extra}'` : "45'";
      }

      if (minute < 90) {
        return `${minute}'`;
      }

      const extra = minute - 90;
      return extra > 0 ? `90+${extra}'` : "90'";
    }

    function isLiveMatch(match) {
      return !!(match?.inProgress || match?.rawInProgress);
    }

    function setStageMode(isLive) {
      if (centerStageEl) {
        centerStageEl.classList.toggle("is-live", isLive);
      }

      if (countdownTimerEl) {
        countdownTimerEl.classList.toggle("hidden", isLive);
      }

      if (liveBoardEl) {
        liveBoardEl.classList.toggle("hidden", !isLive);
      }

      if (liveTimelineEl) {
        liveTimelineEl.classList.toggle("hidden", !isLive);
      }
    }

    function getLiveDisplayScores(match) {
      if (match.homeScore !== null && match.awayScore !== null) {
        return { home: match.homeScore, away: match.awayScore };
      }

      return { home: 0, away: 0 };
    }

    function shouldShowInGroupHistory(match) {
      const live = match.inProgress || match.rawInProgress;
      const finished = (match.rawCompleted ?? match.completed) && !live;
      return finished || live;
    }

    function updateLiveBoard(match) {
      if (!isLiveMatch(match)) {
        setStageMode(false);
        if (liveTimelineListEl) {
          liveTimelineListEl.innerHTML = "";
        }
        return;
      }

      const home = team(match.home);
      const away = team(match.away);
      const scores = getLiveDisplayScores(match);

      setStageMode(true);
      liveHomeScoreEl.textContent = scores.home;
      liveAwayScoreEl.textContent = scores.away;
      liveHomeShortEl.textContent = home.short;
      liveAwayShortEl.textContent = away.short;
      liveMinuteEl.textContent = liveMinuteText(match);
      loadMatchTimelineForLive(match);
    }

    function getLiveTeamsInStandings() {
      const liveTeams = new Set();

      mergeLiveSchedule().forEach((match) => {
        if (match.inProgress || match.rawInProgress) {
          liveTeams.add(match.home);
          liveTeams.add(match.away);
        }
      });

      return liveTeams;
    }

    function getProvisionalPointTeams() {
      const teams = new Set();

      mergeLiveSchedule().forEach((match) => {
        if ((match.isProvisional || match.rawInProgress) && getStandingsScores(match)) {
          teams.add(match.home);
          teams.add(match.away);
        }
      });

      return teams;
    }

    function getLiveScoresKey() {
      return mergeLiveSchedule()
        .filter((match) => match.inProgress || match.completed || match.rawInProgress)
        .map((match) => {
          return [
            matchKey(match.home, match.away, match.utc),
            match.homeScore,
            match.awayScore,
            match.rawHomeScore,
            match.rawAwayScore,
            match.inProgress ? 1 : 0,
            match.rawInProgress ? 1 : 0,
            match.isProvisional ? 1 : 0,
            match.completed ? 1 : 0,
            match.statusClock,
            Math.floor((getLiveClockSeconds(match) || 0) / 60),
            match.statusPeriod
          ].join(":");
        })
        .join("|");
    }

    function hasLiveMatch() {
      return mergeRawSchedule().some((match) => match.inProgress || match.statusState === "in");
    }

    function scheduleLiveRefresh() {
      window.clearInterval(liveRefreshTimer);
      const interval = hasLiveMatch() ? 5000 : 20000;
      liveRefreshTimer = window.setInterval(loadLiveData, interval);
    }

    function getGroupMatches(groupName) {
      return mergeLiveSchedule()
        .filter((match) => match.group === groupName)
        .sort((a, b) => Date.parse(a.utc) - Date.parse(b.utc));
    }

    function getMatchByKey(key) {
      return mergeLiveSchedule().find((match) => matchKey(match.home, match.away, match.utc) === key);
    }

    function setStandingsPanelHead(mode) {
      if (groupControlsEl) {
        groupControlsEl.classList.toggle("is-hidden", mode !== "standings");
      }

      if (standingsPanelTitleEl) {
        standingsPanelTitleEl.textContent = mode === "players"
          ? "Top Goals · Top Assists"
          : "Bảng xếp hạng vòng bảng";
      }
    }

    function showStandingsView() {
      standingsOverlay = "standings";
      standingsViewEl.classList.remove("hidden");
      playerStatsViewEl.classList.add("hidden");
      groupHistoryViewEl.classList.add("hidden");
      matchDetailViewEl.classList.add("hidden");
      setStandingsPanelHead("standings");
      renderStandings();
    }

    async function openPlayerStats(tab = playerStatsTab) {
      standingsOverlay = "players";
      playerStatsTab = tab;
      standingsViewEl.classList.add("hidden");
      playerStatsViewEl.classList.remove("hidden");
      groupHistoryViewEl.classList.add("hidden");
      matchDetailViewEl.classList.add("hidden");
      setStandingsPanelHead("players");

      if (standingsKickerEl) {
        standingsKickerEl.textContent = "WC26";
      }

      playerStatsViewEl.innerHTML = '<div class="timeline-empty">Đang tải...</div>';
      await renderPlayerStatsView();
    }

    function normalizeLiveScoreTeam(name) {
      return canonicalName(name || "");
    }

    function extractLiveScorePlayersFromHtml(html) {
      const match = String(html || "").match(/<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/);

      if (!match) {
        return null;
      }

      const data = JSON.parse(match[1]);
      const players = data?.props?.pageProps?.initialData?.stats?.players;
      return Array.isArray(players) ? players : null;
    }

    async function fetchLiveScoreStatGroup(group) {
      const response = await fetch(`${liveScoreStatsPageBase}/${group}/`, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`LiveScore ${group} ${response.status}`);
      }

      return extractLiveScorePlayersFromHtml(await response.text());
    }

    async function fetchLiveScoreStatGroupViaApi() {
      const response = await fetch(liveScoreStatsApi, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`LiveScore API ${response.status}`);
      }

      const data = await response.json();
      return {
        goals: Array.isArray(data.goals) ? data.goals : [],
        assists: Array.isArray(data.assists) ? data.assists : [],
        shots: Array.isArray(data.shots) ? data.shots : []
      };
    }

    function buildPlayerStatMaps(goalsRaw, assistsRaw, shotsRaw) {
      const goals = new Map();
      const assists = new Map();
      const shots = new Map();

      for (const player of goalsRaw || []) {
        const id = String(player.id || "");
        if (id) {
          goals.set(id, Number(player.stats?.g) || 0);
        }
      }

      for (const player of assistsRaw || []) {
        const id = String(player.id || "");
        if (id) {
          assists.set(id, Number(player.stats?.a) || 0);
        }
      }

      for (const player of shotsRaw || []) {
        const id = String(player.id || "");
        if (id) {
          shots.set(id, Number(player.stats?.s) || 0);
        }
      }

      return { goals, assists, shots };
    }

    function formatDecimalStat(value) {
      if (value === null || value === undefined || value === "") {
        return "—";
      }

      const parsed = Number(value);
      if (!Number.isFinite(parsed)) {
        return "—";
      }

      return Number.isInteger(parsed) ? String(parsed) : parsed.toFixed(1);
    }

    function formatPlusMinusStat(value) {
      if (value === null || value === undefined || value === "") {
        return "—";
      }

      const parsed = Number(value);
      if (!Number.isFinite(parsed)) {
        return "—";
      }

      const formatted = formatDecimalStat(parsed);
      return parsed > 0 ? `+${formatted}` : formatted;
    }

    function parseLiveScorePlayers(players, tab, statMaps) {
      const metricKey = tab === "assists" ? "a" : "g";

      return (players || [])
        .filter((player) => Number(player?.stats?.[metricKey]) > 0)
        .map((player) => {
          const stats = player.stats || {};
          const id = String(player.id || "");
          return {
            id,
            name: player.name || "—",
            team: normalizeLiveScoreTeam(player.teamName),
            rank: Number(player.rank) || 0,
            goals: statMaps?.goals?.get(id) ?? (Number(stats.g) || 0),
            assists: statMaps?.assists?.get(id) ?? (Number(stats.a) || 0),
            shots: statMaps?.shots?.get(id) ?? (Number(stats.s) || 0),
            sortValue: Number(stats[metricKey]) || 0
          };
        })
        .sort((a, b) => a.rank - b.rank || b.sortValue - a.sortValue || a.name.localeCompare(b.name));
    }

    function getBundledPlayerLeaders() {
      if (!window.WORLDCUP_PLAYER_STATS) {
        return null;
      }

      return {
        goals: window.WORLDCUP_PLAYER_STATS.goals || [],
        assists: window.WORLDCUP_PLAYER_STATS.assists || [],
        shots: window.WORLDCUP_PLAYER_STATS.shots || []
      };
    }

    function loadBundledPlayerStats() {
      return new Promise((resolve) => {
        if (window.WORLDCUP_PLAYER_STATS) {
          resolve(window.WORLDCUP_PLAYER_STATS);
          return;
        }

        const script = document.createElement("script");
        const previous = document.getElementById("playerStatsScript");

        if (previous) {
          previous.remove();
        }

        script.id = "playerStatsScript";
        script.src = `worldcup-player-stats.js?ts=${Date.now()}`;
        script.onload = () => resolve(window.WORLDCUP_PLAYER_STATS || null);
        script.onerror = () => resolve(null);
        document.body.appendChild(script);
      });
    }

    async function fetchPlayerLeaders(force = false) {
      const now = Date.now();
      if (!force && playerLeadersCache && now - playerLeadersFetchedAt < PLAYER_LEADERS_CACHE_MS) {
        return playerLeadersCache;
      }

      let goalsRaw = [];
      let assistsRaw = [];
      let shotsRaw = [];

      try {
        const apiData = await fetchLiveScoreStatGroupViaApi();
        goalsRaw = apiData.goals;
        assistsRaw = apiData.assists;
        shotsRaw = apiData.shots;
      } catch (error) {
        try {
          const [goalsPage, assistsPage, shotsPage] = await Promise.all([
            fetchLiveScoreStatGroup("goals"),
            fetchLiveScoreStatGroup("assist"),
            fetchLiveScoreStatGroup("shots")
          ]);
          goalsRaw = goalsPage || [];
          assistsRaw = assistsPage || [];
          shotsRaw = shotsPage || [];
        } catch (directError) {
          const bundled = getBundledPlayerLeaders();

          if (!bundled) {
            await loadBundledPlayerStats();
          }

          const fallback = getBundledPlayerLeaders();
          goalsRaw = fallback?.goals || [];
          assistsRaw = fallback?.assists || [];
          shotsRaw = fallback?.shots || [];
        }
      }

      const statMaps = buildPlayerStatMaps(goalsRaw, assistsRaw, shotsRaw);

      playerLeadersCache = {
        goals: parseLiveScorePlayers(goalsRaw, "goals", statMaps),
        assists: parseLiveScorePlayers(assistsRaw, "assists", statMaps)
      };
      playerLeadersFetchedAt = now;
      return playerLeadersCache;
    }

    function timelineEventTypeLabel(typeText, text) {
      const lower = `${typeText} ${text}`.toLowerCase();
      const typeLower = String(typeText || "").toLowerCase();

      if (lower.includes("goal")) {
        return "goal";
      }

      if (typeLower.startsWith("var") || typeLower.includes("var -") || typeLower.includes("var decision")) {
        return "var";
      }

      if (typeLower === "yellow card" || (lower.includes("yellow") && lower.includes("card"))) {
        return "yellow";
      }

      if (typeLower === "red card" || lower.includes("red card")) {
        return "red";
      }

      if (lower.includes("substitution") || lower.includes("sub ")) {
        return "sub";
      }

      if (lower.includes("var")) {
        return "var";
      }

      if (lower.includes("penalty")) {
        return "penalty";
      }

      return "other";
    }

    function timelineTypeVi(kind) {
      const labels = {
        goal: "Bàn thắng",
        yellow: "Thẻ vàng",
        red: "Thẻ đỏ",
        sub: "Thay người",
        var: "VAR",
        penalty: "Phạt đền",
        other: "Sự kiện"
      };

      return labels[kind] || "Sự kiện";
    }

    function extractPlayerFromText(text) {
      const body = String(text || "").trim();
      if (!body) {
        return "";
      }

      const parenMatch = body.match(/^([^(]+?)\s*\(/);
      if (parenMatch) {
        return parenMatch[1].trim();
      }

      const afterScore = body.includes(". ") ? body.split(". ").slice(1).join(". ") : body;
      const goalMatch = afterScore.match(/^([^(]+?)\s*\(/);
      if (goalMatch) {
        return goalMatch[1].trim();
      }

      return "";
    }

    function extractAssistFromText(text) {
      const body = String(text || "");
      const assistedMatch = body.match(/Assisted by\s+([^.]+)/i);
      if (assistedMatch) {
        return assistedMatch[1].trim();
      }

      return "";
    }

    function normalizeEventTeam(name) {
      return canonicalName(liveNameAliases[name] || name || "");
    }

    function parseTimelineFromSummary(data) {
      const events = [];
      const pushEvent = (minute, typeText, text, meta = {}) => {
        const body = String(text || typeText || "").trim();
        if (!body) {
          return;
        }

        const kind = timelineEventTypeLabel(typeText, body);
        const player = meta.player || extractPlayerFromText(body);
        events.push({
          minute: minute || "—",
          clockValue: Number.isFinite(meta.clockValue) ? meta.clockValue : minuteSortKey(minute),
          kind,
          label: timelineTypeVi(kind),
          text: body,
          player,
          teamName: meta.teamName || "",
          athleteId: meta.athleteId || "",
          assistPlayer: meta.assistPlayer || "",
          assistId: meta.assistId || "",
          subInId: meta.subInId || "",
          subOutId: meta.subOutId || ""
        });
      };

      const keyEvents = Array.isArray(data.keyEvents) ? data.keyEvents : [];
      keyEvents.forEach((item) => {
        const minute = item.clock?.displayValue || item.clock?.value || item.period?.displayValue || "";
        const typeText = item.type?.text || item.type?.description || "";
        const text = item.text || item.shortText || item.description || "";
        const player = item.participants?.[0]?.athlete?.displayName
          || item.participants?.[0]?.athlete?.shortName
          || "";
        const participants = Array.isArray(item.participants) ? item.participants : [];
        const kindPreview = timelineEventTypeLabel(typeText, text);
        const meta = {
          player,
          teamName: item.team?.displayName || "",
          clockValue: Number(item.clock?.value),
          athleteId: "",
          subInId: "",
          subOutId: ""
        };

        if (kindPreview === "sub" && participants.length >= 2) {
          meta.subInId = String(participants[0]?.athlete?.id || "");
          meta.subOutId = String(participants[1]?.athlete?.id || "");
          meta.athleteId = meta.subInId;
        } else if (kindPreview === "goal") {
          meta.athleteId = String(participants[0]?.athlete?.id || "");
          if (participants.length >= 2) {
            meta.assistPlayer = participants[1]?.athlete?.displayName
              || participants[1]?.athlete?.shortName
              || "";
            meta.assistId = String(participants[1]?.athlete?.id || "");
          }

          if (!meta.assistPlayer) {
            meta.assistPlayer = extractAssistFromText(text);
          }
        } else {
          meta.athleteId = String(participants[0]?.athlete?.id || "");
        }

        pushEvent(minute, typeText, text, meta);
      });

      if (events.length === 0 && Array.isArray(data.commentary)) {
        data.commentary.forEach((item) => {
          const minute = item.time?.displayValue || item.clock?.displayValue || "";
          const typeText = item.type?.text || "";
          const text = item.text || item.shortText || "";
          pushEvent(minute, typeText, text);
        });
      }

      const headerCompetition = data.header?.competitions?.[0];
      const scoringPlays = headerCompetition?.scoringPlays || data.scoringPlays;
      if (events.length === 0 && Array.isArray(scoringPlays)) {
        scoringPlays.forEach((item) => {
          const minute = item.clock?.displayValue || "";
          const text = item.text || item.shortDescription || item.description || "Bàn thắng";
          pushEvent(minute, "Goal", text);
        });
      }

      return events;
    }

    const matchStatDefs = [
      { key: "totalShots", label: "Sút bóng", better: "higher" },
      { key: "shotsOnTarget", label: "Sút trúng đích", better: "higher" },
      { key: "possessionPct", label: "Kiểm soát bóng", better: "higher", percent: true },
      { key: "totalPasses", label: "Đường chuyền", better: "higher" },
      { key: "passPct", label: "Chính xác chuyền", better: "higher", ratio: true },
      { key: "foulsCommitted", label: "Phạm lỗi", better: "lower" },
      { key: "yellowCards", label: "Thẻ vàng", better: "lower" },
      { key: "redCards", label: "Thẻ đỏ", better: "lower" },
      { key: "offsides", label: "Việt vị", better: "lower" },
      { key: "wonCorners", label: "Phạt góc", better: "higher" }
    ];

    function parseStatNumber(stat) {
      if (!stat) {
        return null;
      }

      if (Number.isFinite(Number(stat.value))) {
        return Number(stat.value);
      }

      const cleaned = String(stat.displayValue || "").replace(/,/g, "").replace(/%/g, "").trim();
      const parsed = Number.parseFloat(cleaned);
      return Number.isFinite(parsed) ? parsed : null;
    }

    function getTeamStatValue(teamBlock, key) {
      const stat = teamBlock?.statistics?.find((item) => item.name === key);
      if (!stat) {
        if (key === "passPct") {
          const accurate = getTeamStatValue(teamBlock, "accuratePasses");
          const total = getTeamStatValue(teamBlock, "totalPasses");
          if (accurate !== null && total !== null && total > 0) {
            return accurate / total;
          }
        }

        return null;
      }

      return parseStatNumber(stat);
    }

    function normalizeRatioValue(value) {
      if (value === null) {
        return null;
      }

      if (value > 0 && value <= 1) {
        return value;
      }

      if (value > 1 && value <= 100) {
        return value / 100;
      }

      return value;
    }

    function formatMatchStatValue(value, def) {
      if (value === null) {
        return "—";
      }

      if (def.ratio) {
        const ratio = normalizeRatioValue(value);
        return `${Math.round(ratio * 100)}%`;
      }

      if (def.percent) {
        const rounded = Math.round(value * 10) / 10;
        const text = Number.isInteger(rounded) ? String(Math.round(rounded)) : rounded.toFixed(1);
        return `${text}%`;
      }

      return String(Math.round(value * 10) / 10);
    }

    function statBestSides(homeRaw, awayRaw, better) {
      if (homeRaw === null || awayRaw === null || homeRaw === awayRaw) {
        return ["", ""];
      }

      if (better === "lower") {
        return homeRaw < awayRaw ? ["is-best", ""] : ["", "is-best"];
      }

      return homeRaw > awayRaw ? ["is-best", ""] : ["", "is-best"];
    }

    function resolveSummaryTeamBlock(teams, teamName) {
      const target = canonicalName(teamName);

      return teams.find((item) => {
        const displayName = item.team?.displayName || "";
        const abbreviation = item.team?.abbreviation || "";
        const normalized = normalizeEspnTeam(displayName, abbreviation);
        return canonicalName(normalized) === target || canonicalName(displayName) === target;
      });
    }

    function parseStatsFromSummary(data, match) {
      const teams = data.boxscore?.teams;
      if (!Array.isArray(teams) || teams.length < 2) {
        return null;
      }

      let homeTeam;
      let awayTeam;

      if (match) {
        homeTeam = resolveSummaryTeamBlock(teams, match.home) || teams[0];
        awayTeam = resolveSummaryTeamBlock(teams, match.away) || teams[1];
      } else {
        const competitors = data.header?.competitions?.[0]?.competitors || [];
        const homeId = competitors.find((item) => item.homeAway === "home")?.team?.id;
        const awayId = competitors.find((item) => item.homeAway === "away")?.team?.id;
        homeTeam = teams.find((item) => String(item.team?.id) === String(homeId)) || teams[0];
        awayTeam = teams.find((item) => String(item.team?.id) === String(awayId)) || teams[1];
      }

      const rows = matchStatDefs.map((def) => {
        const homeRaw = getTeamStatValue(homeTeam, def.key);
        const awayRaw = getTeamStatValue(awayTeam, def.key);
        const [homeBest, awayBest] = statBestSides(homeRaw, awayRaw, def.better);

        return {
          label: def.label,
          home: formatMatchStatValue(homeRaw, def),
          away: formatMatchStatValue(awayRaw, def),
          homeBest,
          awayBest
        };
      });

      const scheduleHome = match ? team(match.home).short : homeTeam.team?.abbreviation || "";
      const scheduleAway = match ? team(match.away).short : awayTeam.team?.abbreviation || "";

      return {
        homeShort: scheduleHome,
        awayShort: scheduleAway,
        rows
      };
    }

    function lineupRoleFromPosition(abbr) {

      if (key.startsWith("DM") || key === "CDM") {

      if (key === "RM" || key === "RW") {

      }

      if (key === "F" || key.startsWith("ST") || key.startsWith("CF")) {
